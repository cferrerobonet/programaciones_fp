# Versión de la app (SemVer): aquí y en src/programaciones/__init__.py, que un test compara.
[project]
name = "programaciones"
version = "0.15.1"
description = "Programación didáctica de un módulo de FP con la plantilla del centro, en Word y PDF"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Carlos Ferrero Bonet" }]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "N"]
# N802/N806: nombres en castellano; E501: las líneas largas de texto oficial; UP031: «{%s}» es más claro con las llaves
# de los espacios de nombres de XML
ignore = ["E501", "E731", "SIM105", "SIM117", "N802", "N806", "N818", "UP031", "UP037"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "BLE", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src", "."]
addopts = "-q -p no:cacheprovider"
timeout = 120
qt_api = "pyqt6"
markers = [
    "ui: abre ventanas (pytest-qt, sin pantalla con QT_QPA_PLATFORM=offscreen)",
    "referencias: compara con las programaciones de referencia de la bóveda (solo en local, PROGRAMACIONES_REFERENCIAS)",
]

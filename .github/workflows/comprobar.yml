# Calidad en cada push y PR: ruff, el catálogo (esquemas, horas, RA y fuentes) y la suite.
# La comparación con las programaciones de referencia (-m referencias) se salta aquí: solo en local, con la bóveda.
name: Comprobar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, catálogo y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check scripts src tests
      - name: Catálogo
        run: python scripts/catalogo.py comprobar
      - name: Suite
        run: pytest

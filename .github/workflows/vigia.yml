# Vigía del catálogo (F5, docs/CATALOGO_Y_FUENTES.md §2): cada lunes, y a mano desde Actions.
#
#   1. scripts/vigia.py revisar: vuelve a leer el BOE y el DOGV de catalogo/fuentes.yaml (caché vacía, agente
#      identificable y pausa entre peticiones), rehace el catálogo y busca normas nuevas (referencias posteriores,
#      textos consolidados, sumarios del BOE y la página de normativa de FP de la Conselleria). Si una fuente no
#      responde, falla aquí y no toca nada.
#   2. Si hay cambios: comprobaciones automáticas (catálogo con enlaces vivos, ruff y la suite).
#   3. scripts/vigia.py pr: abre una PR con la diferencia legible, la huella nueva y «Revisar a mano», se la asigna a
#      CarlosFB y comenta el resultado de las comprobaciones. Nunca la fusiona ni la aprueba (ADR-028): el catálogo se
#      publica cuando CarlosFB la fusiona en main (catalogo.yml; docs/OPERACIONES.md).
#   4. En julio, agosto y septiembre: incidencia para dar de alta el curso escolar que empieza.
#
# «simulacro» (solo a mano): un cambio ficticio en un criterio de 0517 recorre el camino hasta una PR en borrador, que
# no se fusiona nunca.
name: Vigía

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      dias:
        description: "Días de sumarios del BOE que se revisan"
        default: "8"
      simulacro:
        description: "Cambio ficticio para probar la PR (borrador, no se fusiona)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    name: Fuentes oficiales
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui poppler-utils \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 fonts-dejavu-core
      - name: Revisar las fuentes
        id: revisar
        env:
          PROGRAMACIONES_PAUSA: "2"
        run: |
          python scripts/vigia.py revisar --dias "${{ inputs.dias || '8' }}" \
            ${{ inputs.simulacro && '--simulacro' || '' }} \
            --informe "$RUNNER_TEMP/vigia-informe.md" --resultado "$RUNNER_TEMP/vigia-resultado.json"
      - name: Comprobaciones automáticas
        id: comprobaciones
        if: steps.revisar.outputs.cambios == 'true'
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          PROGRAMACIONES_PAUSA: "1"
        run: |
          python scripts/catalogo.py comprobar --red
          ruff check scripts src tests
          pytest
      - name: Abrir la PR
        if: steps.revisar.outputs.cambios == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "vigia-programaciones"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/vigia.py pr --informe "$RUNNER_TEMP/vigia-informe.md" \
            --resultado "$RUNNER_TEMP/vigia-resultado.json" --comprobaciones "${{ steps.comprobaciones.outcome }}"
      - name: Curso escolar que empieza
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/vigia.py curso

ra:
- 'n': 1
  texto:
    es: Desmonta elementos fijos soldados, analizando las técnicas de desmontaje y según procesos establecidos.
  criterios:
  - letra: a
    texto:
      es: Se ha descrito el despiece de los elementos que componen una carrocería, bastidor o cabina y equipos, relacionando la función de los elementos con el tipo de unión.
  - letra: b
    texto:
      es: Se han seleccionado los equipos necesarios para el corte de puntos y cordones de soldadura.
  - letra: c
    texto:
      es: Se ha interpretado la documentación técnica para determinar las uniones y los puntos de corte.
  - letra: d
    texto:
      es: Se ha relacionado la simbología con las uniones que representa en el vehículo.
  - letra: e
    texto:
      es: Se ha determinado el método que se va a aplicar en la sustitución de los elementos fijos.
  - letra: f
    texto:
      es: Se han quitado puntos y cordones de soldadura con los equipos y útiles necesarios.
  - letra: g
    texto:
      es: Se han identificado las zonas determinadas para el corte y las zonas de refuerzo.
  - letra: h
    texto:
      es: Se ha realizado el trazado del corte, teniendo en cuenta el tipo de unión (solapada, tope, refuerzo, entre otros).
  - letra: i
    texto:
      es: Se ha verificado que las operaciones de corte realizadas se ajustan a las especificaciones establecidas en las normas técnicas.
  - letra: j
    texto:
      es: Se ha mantenido el área de trabajo con el grado apropiado de orden y limpieza.
- 'n': 2

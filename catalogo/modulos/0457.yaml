      es: Se han obtenido los valores de las medidas asignándoles la aproximación adecuada, según la precisión del instrumento o equipo.
  - letra: g
    texto:
      es: Se han verificado las unidades de gestión electrónica, interpretando los parámetros obtenidos.
  - letra: h

      es: Se ha descrito el funcionamiento de los elementos y conjuntos de los circuitos.
  - letra: c
    texto:
      es: Se han relacionado las leyes y reglas eléctricas con el funcionamiento de los elementos y conjuntos de los circuitos eléctricos auxiliares.
  - letra: d
    texto:
      es: Se han interpretado los parámetros de funcionamiento.
  - letra: e
    texto:
      es: Se han interpretado los esquemas de los circuitos eléctricos, reconociendo su funcionalidad y los elementos que los componen.
  - letra: f
    texto:
      es: Se han representado esquemas de los sistemas de alumbrado, maniobra, control, señalización, y otros sistemas auxiliares, aplicando la simbología específica.

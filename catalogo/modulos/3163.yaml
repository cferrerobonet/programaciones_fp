    texto:
      es: Organizar y comunicar información científica y matemática de forma clara y rigurosa de manera verbal, gráfica, numérica, etc. utilizando el formato más adecuado.
  - 'n': '5.2'
    texto:
      es: Analizar e interpretar información científica y matemática presente en la vida cotidiana manteniendo una actitud crítica.
  - 'n': '5.3'
    texto:

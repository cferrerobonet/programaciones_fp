ce:
- 'n': 1
  texto:
    es: Reconocer los motivos por los que ocurren los principales fenómenos naturales, a partir de situaciones cotidianas, y explicarlos en términos de las leyes y teorías científicas adecuadas, para poner en valor la contribución de la ciencia a la sociedad.
  descriptores:
  - CCL1
  - STEM1
  - STEM2
  - STEM4
  - CD1
  - CPSAA4
  - CC3
  criterios:
  - 'n': '1.1'
    texto:
      es: Explicar los fenómenos naturales más relevantes en términos de teorías, leyes y principios científicos adecuados como estrategia en la toma de decisiones fundamentadas.
  - 'n': '1.2'
    texto:
      es: Justificar la contribución de la ciencia a la sociedad, y la labor de los hombres y mujeres dedicados a su desarrollo, entendiendo la investigación como una labor colectiva en constante evolución fruto de la interacción entre la ciencia, la tecnología, la sociedad y el medio ambiente.
- 'n': 2
  texto:
    es: Interpretar y modelizar en términos científicos problemas y situaciones de la vida cotidiana y profesional, aplicando diferentes estrategias, formas de razonamiento, herramientas tecnológicas y el pensamiento computacional, para hallar y analizar soluciones comprobando su validez.
  descriptores:
  - CCL2
  - STEM1
  - STEM2
  - CD1
  - CD2
  - CPSAA4
  - CE1
  criterios:
  - 'n': '2.1'
    texto:
      es: Elaborar representaciones que ayuden en la búsqueda de estrategias de resolución de una situación problematizada, organizando los datos y comprendiendo las preguntas formuladas.
  - 'n': '2.2'
    texto:
      es: Hallar las soluciones de un problema utilizando los datos e información aportados, los propios conocimientos, y las estrategias y herramientas apropiadas.
  - 'n': '2.3'
    texto:
      es: Comprobar la corrección de las soluciones de un problema y su coherencia en el contexto planteado.
  - 'n': '2.4'
    texto:
      es: Emplear herramientas tecnológicas adecuadas en la representación, la resolución de problemas y la comprobación de las soluciones.
- 'n': 3
  texto:
    es: Utilizar los métodos científicos, haciendo indagaciones y llevando a cabo proyectos, para desarrollar los razonamientos propios del pensamiento científico y mejorar las destrezas en el uso de las metodologías científicas.
  descriptores:
  - STEM1
  - STEM2
  - STEM3
  - CD1
  - CD3
  - CPSAA4
  - CPSAA5
  - CE1
  criterios:
  - 'n': '3.1'
    texto:
      es: Plantear preguntas e hipótesis que puedan ser respondidas o contrastadas utilizando los métodos científicos, la observación, la información y el razonamiento, explicando fenómenos naturales y realizando predicciones sobre estos.
  - 'n': '3.2'
    texto:
      es: Diseñar y realizar experimentos y obtener datos cuantitativos y cualitativos sobre fenómenos naturales en el medio natural y en el laboratorio, utilizando con corrección los instrumentos, herramientas o técnicas adecuadas a la hora de obtener resultados claros que respondan a cuestiones concretas o que contrasten la veracidad de una hipótesis.
  - 'n': '3.3'
    texto:
      es: Interpretar los resultados obtenidos en proyectos de investigación, utilizando el razonamiento y, cuando sea necesario, herramientas matemáticas y tecnológicas.
- 'n': 4
  texto:
    es: Analizar los efectos de determinadas acciones cotidianas o del entorno profesional sobre la salud, el medio natural y social, basándose en fundamentos científicos, para valorar la importancia de los hábitos que mejoran la salud individual y colectiva, evitan o minimizan los impactos medioambientales negativos y son compatibles con un desarrollo sostenible.
  descriptores:
  - STEM5

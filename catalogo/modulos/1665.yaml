ra:
- 'n': 1
  texto:
    es: 'Analiza el concepto de digitalización y su repercusión en los sectores productivos teniendo en cuenta la actividad de la empresa e identificando entornos IT (Information Technology: tecnología de la información) y OT (Operation Technology: tecnología de operación) característicos. Digitalización contra Transformación digital.'
  criterios:
  - letra: a
    texto:
      es: Se ha descrito en qué consiste el concepto de digitalización.
  - letra: b
    texto:
      es: Se ha relacionado la implantación de la tecnología digital con la organización de las empresas.
  - letra: c
    texto:
      es: Se han establecido las diferencias y similitudes entre los entornos IT y OT.
  - letra: d
    texto:
      es: Se han identificado los departamentos típicos de las empresas que pueden constituir entornos IT.
  - letra: e
    texto:
      es: Se han seleccionado las tecnologías típicas de la digitalización en planta y en negocio.
  - letra: f
    texto:
      es: Se ha analizado la importancia de la conexión entre entornos IT y OT.
  - letra: g
    texto:
      es: Se han analizado las ventajas de digitalizar una empresa industrial de extremo a extremo.
- 'n': 2
  texto:
    es: Caracteriza las tecnologías habilitadoras digitales necesarias para la adecuación/transformación de las empresas a entornos digitales describiendo sus características y aplicaciones.
  criterios:
  - letra: a
    texto:
      es: Se han identificado las principales tecnologías habilitadoras digitales.
  - letra: b
    texto:
      es: Se han relacionado las THD con el desarrollo de productos y servicios.
  - letra: c
    texto:
      es: Se ha relacionado la importancia de las THD con la economía sostenible y eficiente.
  - letra: d
    texto:
      es: Se han identificado nuevos mercados generados por las THD.
  - letra: e
    texto:
      es: Se ha analizado la implicación de THD tanto en la parte de negocio como en la parte de planta.
  - letra: f
    texto:
      es: Se han identificado las mejoras producidas debido a la implantación de las tecnologías habilitadoras en relación con los entornos IT y OT.
  - letra: g
    texto:
      es: Se ha elaborado un informe que relacione las tecnologías con sus características y áreas de aplicación.

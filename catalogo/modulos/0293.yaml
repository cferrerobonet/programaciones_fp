ra:
- 'n': 1
  texto:
    es: Determina las características de funcionamiento de los motores de ciclo Otto y de ciclo Diésel analizando sus parámetros de construcción y la funcionalidad de sus elementos.
  criterios:
  - letra: a
    texto:
      es: Se han realizado los diagramas termodinámicos de los ciclos teóricos y prácticos de motores Otto, Diésel, entre otros.
  - letra: b
    texto:
      es: Se han calculado las variables de los ciclos teóricos, (presión temperatura, volumen, entre otras) determinado su influencia sobre el rendimiento térmico.
  - letra: c
    texto:
      es: Se han identificado las características constructivas de los motores Otto, Diésel y rotativo relacionándolas con su influencia sobre el aprovechamiento energético.
  - letra: d
    texto:
      es: Se ha explicado el funcionamiento de los elementos que constituyen los diferentes motores.
  - letra: e
    texto:
      es: Se han explicado los procesos de desmontaje y montaje del motor según procedimientos especificados.
  - letra: f
    texto:
      es: Se ha explicado el manejo de los equipos de metrología utilizados en la verificación del motor
  - letra: g
    texto:
      es: Se han explicado las verificaciones a realizar en los elementos del motor.
  - letra: h
    texto:
      es: Se han descrito las curvas características del motor térmico obtenidas en el banco de pruebas.
  - letra: i
    texto:
      es: Se han explicado los parámetros que se deben ajustar en los motores y la forma de realizar los ajustes.
- 'n': 2
  texto:
    es: Verifica los desgastes y deformaciones sufridos en los elementos del motor térmico y los sistemas de lubricación y refrigeración, justificando los procedimientos utilizados en la verificación.
  criterios:
  - letra: a
    texto:
      es: Se han seleccionado las herramientas y equipos necesarios.
  - letra: b
    texto:

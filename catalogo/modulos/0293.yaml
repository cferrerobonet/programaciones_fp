  - letra: c
    texto:
      es: Se ha desmontado el motor siguiendo las especificaciones técnicas.
  - letra: d
    texto:
      es: Se ha comprobado la cilindrada y relación de compresión comparándola con las especificaciones del fabricante.
  - letra: e
    texto:
      es: Se ha verificado dimensional y funcionalmente los elementos del motor, comprobando su operatividad según especificaciones técnicas.
  - letra: f
    texto:

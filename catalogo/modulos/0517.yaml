      es: Se han utilizado los medios, instrumentos de medida y herramientas informáticas específicos para cada instalación.
  - letra: c
    texto:
      es: Se han ajustado los equipos de instalaciones de telecomunicaciones en local y de forma remota.
  - letra: d
    texto:
      es: Se ha verificado que los resultados obtenidos en las medidas, cumplen la normativa o están dentro de los márgenes establecidos de funcionamiento.
  - letra: e
    texto:
      es: Se han realizado medidas y pruebas de funcionamiento.
  - letra: f
    texto:
      es: Se han cumplimentado las hojas de pruebas de aceptación.

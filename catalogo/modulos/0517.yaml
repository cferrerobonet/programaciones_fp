ra:
- 'n': 1
  texto:
    es: Caracteriza instalaciones de infraestructuras comunes de telecomunicaciones, analizando las redes que la componen y describiendo la función y características de los equipos y elementos que las integran.
  criterios:
  - letra: a
    texto:
      es: Se han identificado los tipos de instalaciones de acuerdo a la normativa sobre infraestructuras comunes de telecomunicaciones en edificios.
  - letra: b
    texto:
      es: Se ha relacionado la simbología con los elementos y equipos de la instalación.
  - letra: c
    texto:
      es: Se han reconocido los tipos y la función de recintos y registros de una Infraestructura Común de Telecomunicaciones (ITC).
  - letra: d
    texto:
      es: Se han identificado los tipos de canalizaciones.
  - letra: e
    texto:
      es: Se han identificado los tipos de redes que componen la ICT.
  - letra: f
    texto:
      es: Se han identificado los equipos de cada sistema de una ICT.
  - letra: g
    texto:
      es: Se ha reconocido la función de los elementos de la ICT.
  - letra: h
    texto:
      es: Se han identificado las características técnicas de los dispositivos.
  - letra: i
    texto:
      es: Se han considerado posibles evoluciones tecnológicas y normativas.
- 'n': 2
  texto:
    es: Configura infraestructuras de telecomunicaciones, representando las instalaciones sobre planos y elaborando esquemas.
  criterios:
  - letra: a
    texto:
      es: Se han identificado las especificaciones técnicas de las instalaciones.
  - letra: b
    texto:
      es: Se han verificado las características de ubicación de las instalaciones.
  - letra: c
    texto:
      es: Se han representado sobre planos los trazados y elementos (cableados, arquetas y registros, entre otros) de la instalación.
  - letra: d
    texto:
      es: Se han calculado los parámetros de los elementos y equipos.
  - letra: e
    texto:
      es: Se han elaborado los esquemas, con la simbología normalizada.
  - letra: f
    texto:
      es: Se han dimensionado los elementos de la instalación.
  - letra: g
    texto:
      es: Se han seleccionado elementos de las instalaciones de radio, televisión y telefonía.
  - letra: h
    texto:
      es: Se han dimensionado los elementos de la instalación eléctrica dedicada.
  - letra: i
    texto:
      es: Se ha tenido en cuenta interferencias con otras instalaciones.
  - letra: j
    texto:
      es: Se han configurado las instalaciones teniendo en cuenta la posibilidad de ampliaciones.
  - letra: k
    texto:
      es: Se ha aplicado la normativa de ICT y el REBT en la configuración de la instalación.
- 'n': 3
  texto:
    es: Instala infraestructuras comunes de telecomunicaciones, aplicando técnicas y verificando la adecuación a la normativa y la calidad de las instalaciones.
  criterios:
  - letra: a
    texto:
      es: Se ha aplicado el plan de montaje de la instalación de ICT.
  - letra: b
    texto:
      es: Se han programado las actividades de montaje.
  - letra: c
    texto:
      es: Se ha verificado o ejecutado el replanteo de la instalación.
  - letra: d
    texto:
      es: Se ha verificado o ejecutado el montaje y orientación de los elementos de captación de señales.
  - letra: e
    texto:
      es: Se ha verificado o ejecutado el montaje de canalizaciones y conductores.
  - letra: f
    texto:
      es: Se ha verificado o ejecutado el montaje y configuración de los equipos y elementos característicos de cada instalación.
  - letra: g
    texto:
      es: Se ha verificado o ejecutado el montaje las instalaciones eléctricas dedicadas.
- 'n': 4
  texto:
    es: Verifica el funcionamiento de las instalaciones, midiendo parámetros y ajustando sus elementos.
  criterios:

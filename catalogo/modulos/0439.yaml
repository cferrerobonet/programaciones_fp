ra:
- 'n': 1
  texto:
    es: Describe las características inherentes a la innovación empresarial relacionándolas con la actividad de creación de empresas.
  criterios:
  - letra: a
    texto:
      es: Se han analizado las diversas posibilidades de innovación empresarial (técnicas, materiales, de organización interna y externa, entre otras), relacionándolas como fuentes de desarrollo económico y creación de empleo.
  - letra: b
    texto:
      es: Se han descrito las implicaciones que tiene para la competitividad empresarial la innovación y la iniciativa emprendedora.
  - letra: c
    texto:
      es: Se han comparado y documentado diferentes experiencias de innovación empresarial, describiendo y valorando los factores de riesgo asumidos en cada una de ellas.
  - letra: d
    texto:
      es: Se han definido las características de empresas de base tecnológica, relacionándolas con los distintos sectores económicos.
  - letra: e
    texto:
      es: Se han enumerado algunas iniciativas innovadoras que puedan aplicarse a empresas u organizaciones ya existentes para su mejora.
  - letra: f
    texto:
      es: Se han analizado posibilidades de internacionalización de algunas empresas como factor de innovación de las mismas.
  - letra: g
    texto:
      es: Se han buscado ayudas y herramientas, públicas y privadas, para la innovación, creación e internacionalización de empresas, relacionándolas estructuradamente en un informe.
- 'n': 2
  texto:
    es: Identifica el concepto de empresa y empresario analizando su forma jurídica y la normativa a la que está sujeto.
  criterios:
  - letra: a
    texto:
      es: Se ha definido el concepto de empresa.
  - letra: b
    texto:

ra:
- 'n': 1
  texto:
    es: Identifica los elementos de las infraestructuras comunes de telecomunicaciones en viviendas y edificios, analizando los sistemas que las integran.
  criterios:
  - letra: a
    texto:
      es: Se ha analizado la normativa sobre infraestructuras comunes de telecomunicaciones en edificios.
  - letra: b
    texto:
      es: Se han identificado los elementos de las zonas comunes y privadas.
  - letra: c
    texto:
      es: Se han descrito los tipos de instalaciones que componen una ICT (infraestructura común de telecomunicaciones).
  - letra: d
    texto:
      es: Se han descrito los tipos y la función de recintos (superior, inferior) y registros (enlace, secundario, entre otros) de una ICT.
  - letra: e
    texto:
      es: Se han identificado los tipos de canalizaciones (externa, de enlace, principal, entre otras).
  - letra: f
    texto:
      es: Se han descrito los tipos de redes que componen la ICT (alimentación, distribución, dispersión e interior).
  - letra: g
    texto:
      es: Se han identificado los elementos de conexión.
  - letra: h
    texto:
      es: Se ha determinado la función y características de los elementos y equipos de cada sistema (televisión, telefonía, seguridad, entre otros).
- 'n': 2
  texto:
    es: Configura pequeñas instalaciones de infraestructuras comunes de telecomunicaciones para viviendas y edificios, determinando los elementos que la conforman y seleccionando componentes y equipos.
  criterios:
  - letra: a
    texto:
      es: Se han identificado las especificaciones técnicas de la instalación.
  - letra: b
    texto:
      es: Se ha aplicado la normativa de ICT y el REBT en la configuración de la instalación.
  - letra: c
    texto:
      es: Se han utilizado herramientas informáticas de aplicación.
  - letra: d
    texto:
      es: Se han calculado los parámetros de los elementos y equipos de la instalación.
  - letra: e
    texto:
      es: Se han realizado los croquis y esquemas de la instalación con la calidad requerida.
  - letra: f
    texto:
      es: Se ha utilizado la simbología normalizada.
  - letra: g
    texto:
      es: Se han seleccionado los equipos y materiales que cumplen las especificaciones funcionales, técnicas y normativas.
  - letra: h
    texto:
      es: Se ha elaborado el presupuesto correspondiente a la solución adoptada.
- 'n': 3
  texto:
    es: Monta instalaciones de infraestructuras comunes de telecomunicaciones para viviendas y edificios interpretando documentación técnica y aplicando técnicas de montaje.
  criterios:
  - letra: a
    texto:
      es: Se ha interpretado la documentación técnica de la instalación (planos, esquemas, reglamentación, entre otros).
  - letra: b
    texto:
      es: Se ha realizado el replanteo de la instalación.
  - letra: c
    texto:
      es: Se han ubicado y fijado canalizaciones.
  - letra: d
    texto:
      es: Se han realizado operaciones de montaje de mástiles y torretas, entre otros.
  - letra: e
    texto:
      es: Se han ubicado y fijado los elementos de captación de señales y del equipo de cabecera.
  - letra: f
    texto:
      es: Se ha tendido el cableado de los sistemas de la instalación (televisión, telefonía y comunicación interior, seguridad, entre otros).
  - letra: g
    texto:
      es: Se han conexionado los equipos y elementos de la instalación.
  - letra: h
    texto:
      es: Se han aplicado los criterios de calidad en las operaciones de montaje.
- 'n': 4
  texto:
    es: Verifica y ajusta los elementos de las instalaciones de infraestructuras comunes de telecomunicaciones midiendo los parámetros significativos e interpretando sus resultados.
  criterios:
  - letra: a
    texto:

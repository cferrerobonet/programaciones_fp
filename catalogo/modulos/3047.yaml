ra:
- 'n': 1
  texto:
    es: Realiza el mantenimiento básico del motor de explosión y diesel analizando sus principios de funcionamiento y justificando las actuaciones de mantenimiento requeridas.
  criterios:
  - letra: a
    texto:
      es: Se han relacionado los principios de funcionamiento de los motores de explosión de dos y cuatro tiempos, en gasolina y diesel con sus elementos constructivos.
  - letra: b
    texto:
      es: Se han comprobado los niveles del circuito de lubricación y refrigeración, reponiéndolos en caso necesario según las normas y condiciones de seguridad establecidas.
  - letra: c
    texto:
      es: Se han extraído y repuesto los fluidos del circuito de lubricación y refrigeración, en las condiciones de seguridad requeridas, comprobando sus niveles según las especificaciones del fabricante.
  - letra: d
    texto:
      es: Se ha realizado la sustitución de componentes básicos del circuito de engrase (filtro de aceite, cárter, entre otros) según los procedimientos establecidos y las especificaciones del fabricante.
  - letra: e
    texto:
      es: Se han sustituido elementos básicos del circuito de refrigeración comprobando la ausencia de fugas y aplicando los pares de apriete especificados por el fabricante, y conforme a las condiciones de seguridad requeridas.
  - letra: f
    texto:
      es: Se ha realizado la sustitución de los diferentes filtros del vehículo (filtro de aire, filtro de aceite, filtro de gasóleo, entre otros), comprobando su funcionamiento y siguiendo las normas y condiciones de seguridad establecidas.
  - letra: g
    texto:
      es: Se han sustituido las bujías de encendido y calentadores en motores de gasolina y diesel respectivamente, utilizando la herramienta adecuada, comprobando su funcionamiento y siguiendo las normas y condiciones de seguridad establecidas.
  - letra: h
    texto:
      es: Se han repuesto las correas de servicio verificando su ajuste y funcionamiento conforme a las especificaciones del fabricante.
  - letra: i
    texto:
      es: Se ha llevado a cabo la lubricación, limpieza y mantenimiento de primer nivel de los distintos equipos, útiles y herramientas utilizadas en la según las especificaciones del fabricante.
  - letra: j
    texto:
      es: Se ha operado de forma ordenada, con pulcritud, precisión y seguridad, aplicando los procedimientos y técnicas adecuadas, procurando no causar daño a los elementos periféricos.
- 'n': 2
  texto:
    es: Realiza el mantenimiento básico del sistema de suspensión y ruedas del vehículo, analizando sus principios de funcionamiento y justificando las actuaciones de mantenimiento requeridas.
  criterios:
  - letra: a
    texto:

  - letra: b
    texto:
      es: Se ha realizado el desmontaje de los amortiguadores del vehículo siguiendo las especificaciones del fabricante y teniendo en cuenta las condiciones de seguridad requeridas.
  - letra: c
    texto:
      es: Se ha separado el amortiguador de su muelle en condiciones de seguridad, utilizando el útil adecuado y siguiendo las especificaciones del fabricante.
  - letra: d
    texto:
      es: Se han desmontado y montado las barras de torsión de un vehículo comprobando su posición y siguiendo las especificaciones del fabricante.
  - letra: e
    texto:
      es: Se han repuesto las ballestas de suspensión teniendo en cuenta los procedimientos establecidos y las especificaciones del fabricante.
  - letra: f

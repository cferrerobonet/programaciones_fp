      es: Se han identificado las causas más frecuentes de accidentes en la manipulación de materiales, herramientas, entre otros.
  - letra: d
    texto:
      es: Se han descrito los elementos de seguridad (protecciones, alarmas y paros de emergencia, entre otros) de las máquinas y los equipos de protección individual (calzado, protección ocular e indumentaria, entre otros) que se deben emplear en las distintas operaciones de montaje y mantenimiento.
  - letra: e
    texto:
      es: Se ha relacionado la manipulación de materiales, herramientas y máquinas con las medidas de seguridad y protección personal requeridas.
  - letra: f
    texto:
      es: Se han determinado las medidas de seguridad y de protección personal que se deben adoptar en la preparación y ejecución de las operaciones de montaje y mantenimiento de las instalaciones fotovoltaicas y eólicas.
  - letra: g
    texto:
      es: Se han identificado las posibles fuentes de contaminación del entorno ambiental.
  - letra: h
    texto:
      es: Se han clasificado los residuos generados para su retirada selectiva.
  - letra: i
    texto:
      es: Se ha valorado el orden y la limpieza de instalaciones y equipos como primer factor de prevención de riesgos.

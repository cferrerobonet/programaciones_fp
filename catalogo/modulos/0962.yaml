      es: Se ha relacionado cada elemento de la máquina con su función.
  - letra: d
    texto:
      es: Se han calculado las magnitudes eléctricas y mecánicas requeridas por la aplicación.
  - letra: e
    texto:
      es: Se han relacionado las máquinas con sus aplicaciones.
  - letra: f
    texto:
      es: Se han identificado los sistemas de puesta en marcha de los motores eléctricos.
  - letra: g
    texto:
      es: Se han determinado los parámetros de variación de velocidad de los motores eléctricos.

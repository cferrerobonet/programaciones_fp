ra:
- 'n': 1
  texto:
    es: Determina los parámetros de sistemas eléctricos, realizando cálculos y medidas en circuitos de corriente alterna monofásica y trifásica.
  criterios:
  - letra: a
    texto:
      es: Se han reconocido las características de la señal de corriente alterna senoidal.
  - letra: b
    texto:
      es: Se ha reconocido el comportamiento de los receptores frente a la corriente alterna.
  - letra: c
    texto:
      es: Se han determinado los parámetros de un circuito de corriente alterna.
  - letra: d
    texto:
      es: Se han caracterizado los sistemas de distribución a tres y cuatro hilos.
  - letra: e
    texto:
      es: Se han montado circuitos con receptores de corriente alterna.
  - letra: f
    texto:
      es: Se han realizado cálculos de los parámetros de un circuito de corriente alterna, contrastándolo con las medidas realizadas
  - letra: g
    texto:
      es: Se han identificado los armónicos, sus efectos y las técnicas de filtrado.
  - letra: h
    texto:
      es: Se ha calculado la sección de los conductores eléctricos.
  - letra: i
    texto:
      es: Se han relacionado los dispositivos de protección eléctrica con su funcionalidad y sus parámetros característicos.
  - letra: j
    texto:
      es: Se han dimensionado las protecciones del circuito de corriente alterna.
- 'n': 2
  texto:

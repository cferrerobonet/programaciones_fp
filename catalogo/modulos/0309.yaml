contenidos:
- titulo:
    es: Técnicas de comunicación
  puntos:
  - es: Objetivos de la comunicación.
  - es: 'Tipos de comunicación. Proceso de comunicación: etapas Redes de comunicación, canales y medios. Obstáculos en la comunicación. La comunicación generadora de comportamientos. Actitudes y técnicas de la comunicación oral. Pautas de conducta: la escucha y las preguntas. Modelo de comunicación interpersonal: Barreras y dificultades. Influencia de la tipología de las personas en la elección del canal de comunicación.'
- titulo:
    es: Atención al cliente
  puntos:

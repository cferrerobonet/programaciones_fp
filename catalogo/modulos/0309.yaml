  - es: 'Motivaciones del cliente; actitudes, comportamientos. Técnicas de captación del interlocutor. Técnicas de estrategia de la relación y del estilo comunicativo: La voz, el lenguaje, el silencio, los gestos, entre otros. Técnicas de obtención de información complementaria. Verificación de la comprensión del mensaje y/o grado de satisfacción.'
- titulo:
    es: Transmisión de imagen de empresa
  puntos:
  - es: 'El marketing en la actividad económica: su influencia en la imagen de la empresa.'
  - es: 'Sistemas de organización de las empresas: organigramas. Establecimiento de canales de comunicación con el cliente, tanto presencial como no presencial. Procedimientos de obtención y recogida de información. Imagen corporativa: puntos fuertes, detección de puntos débiles, información a transmitir. Procedimientos transmisión de información dentro de la empresa. Métodos para evaluar la atención al cliente. Empatía.'
- titulo:

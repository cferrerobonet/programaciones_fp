ra:
- 'n': 1
  texto:
    es: Caracteriza el funcionamiento de los sistemas auxiliares en los motores de ciclo Otto interpretando las variaciones de sus parámetros y la funcionalidad de los elementos que los constituyen.
  criterios:
  - letra: a
    texto:
      es: Se han identificado las características de los combustibles utilizados en los motores de gasolina y de gas licuado de petróleo (GLP).
  - letra: b
    texto:
      es: Se han identificado los elementos que constituyen los sistemas de encendido y sus parámetros característicos.
  - letra: c
    texto:
      es: Se han identificado los elementos que componen los sistemas de alimentación de los motores de gasolina y de GLP.
  - letra: d
    texto:
      es: Se han definido los parámetros de los sistemas de alimentación de los motores de gasolina, presiones, caudales, temperaturas, entre otros.
  - letra: e
    texto:
      es: Se han identificado los sensores, actuadores y unidades de gestión que intervienen en los sistemas de inyección de gasolina y de GLP.
  - letra: f
    texto:
      es: Se han relacionado los parámetros de funcionamiento del sistema de inyección de gasolina; tensión, resistencia, señales y curvas características, entre otros; con la funcionalidad del mismo.
  - letra: g
    texto:
      es: 'Se han secuenciado las fases de funcionamiento del motor de gasolina: arranque en frío, postarranque, aceleración y corte en retención, entre otras, interpretando sus características más importantes.'
  - letra: h
    texto:
      es: Se ha manifestado especial interés por la tecnología del sector.

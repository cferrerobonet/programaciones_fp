ra:
- 'n': 1
  texto:
    es: Elabora planes de aprovisionamiento, analizando información de las distintas áreas de la organización o empresa.
  criterios:
  - letra: a
    texto:
      es: Se han definido las fases que componen un programa de aprovisionamiento desde la detección de necesidades hasta la recepción de la mercancía.
  - letra: b
    texto:
      es: Se han determinado los principales parámetros que configuran un programa de aprovisionamiento que garantice la calidad y el cumplimiento del nivel de servicio establecido.
  - letra: c
    texto:
      es: Se han obtenido las previsiones de venta y/o demanda del periodo de cada departamento implicado.
  - letra: d
    texto:
      es: Se han contrastado los consumos históricos, lista de materiales y/o pedidos realizados, en función del cumplimiento de los objetivos del plan de ventas y/o producción previsto por la empresa/organización.
  - letra: e
    texto:
      es: Se ha calculado el coste del programa de aprovisionamiento, diferenciando los elementos que lo componen.
  - letra: f
    texto:
      es: Se ha determinado la capacidad óptima de almacenamiento de la organización, teniendo en cuenta la previsión de stocks.
  - letra: g
    texto:
      es: Se han elaborado las órdenes de suministro de materiales con fecha, cantidad y lotes, indicando el momento y destino/ubicación del suministro al almacén y/o a las unidades productivas precedentes.
  - letra: h
    texto:
      es: Se ha previsto con tiempo suficiente el reaprovisionamiento de la cadena de suministro para ajustar los volúmenes de stock al nivel de servicio, evitando los desabastecimientos.
  - letra: i
    texto:
      es: Se han realizado las operaciones anteriores mediante una aplicación informática de gestión de stocks y aprovisionamiento.
  - letra: j
    texto:
      es: Se ha asegurado la calidad del proceso de aprovisionamiento, estableciendo procedimientos normalizados de gestión de pedidos y control del proceso.
- 'n': 2
  texto:
    es: Realiza procesos de selección de proveedores, analizando las condiciones técnicas y los parámetros habituales.
  criterios:
  - letra: a
    texto:
      es: Se han identificado las fuentes de suministro y búsqueda de proveedores.
  - letra: b
    texto:
      es: Se ha confeccionado un fichero con los proveedores potenciales, de acuerdo con los criterios de búsqueda “on-line” y “off-line”.
  - letra: c
    texto:
      es: Se han realizado solicitudes de ofertas y pliego de condiciones de aprovisionamiento.
  - letra: d
    texto:
      es: Se han recopilado las ofertas de proveedores que cumplan con las condiciones establecidas, para su posterior evaluación.
  - letra: e
    texto:
      es: 'Se han definido los criterios esenciales en la selección de ofertas de proveedores: económicos, plazo de aprovisionamiento, calidad, condiciones de pago y servicio, entre otros.'
  - letra: f
    texto:
      es: Se han comparado las ofertas de varios proveedores de acuerdo con los parámetros de precio, calidad y servicio.
  - letra: g
    texto:
      es: Se ha establecido un baremo de los criterios de selección en función del peso específico que, sobre el total, representa cada una de las variables consideradas.
  - letra: h
    texto:
      es: Se han realizado las operaciones anteriores mediante una aplicación informática de gestión de proveedores.
- 'n': 3
  texto:
    es: Planifica la gestión de las relaciones con los proveedores, aplicando técnicas de negociación y comunicación.
  criterios:
  - letra: a
    texto:
      es: Se han relacionado las técnicas más utilizadas en la comunicación con proveedores.
  - letra: b
    texto:
      es: Se han detectado las ventajas, los costes y los requerimientos técnicos y comerciales de implantación de un sistema de intercambio electrónico de datos, en la gestión del aprovisionamiento.
  - letra: c
    texto:
      es: Se han elaborado escritos de forma clara y concisa de las solicitudes de información a los proveedores.
  - letra: d
    texto:
      es: Se han preparado previamente las conversaciones personales o telefónicas con los proveedores.
  - letra: e
    texto:
      es: Se han identificado los distintos tipos de documentos utilizados para el intercambio de información con proveedores.
  - letra: f
    texto:
      es: Se han explicado las diferentes etapas en un proceso de negociación de condiciones de aprovisionamiento.
  - letra: g
    texto:
      es: Se han descrito las técnicas de negociación más utilizadas en la compra, venta y aprovisionamiento.
  - letra: h
    texto:
      es: Se ha elaborado un informe que recoja los acuerdos de la negociación, mediante el uso de los programas informáticos adecuados.
- 'n': 4
  texto:
    es: Programa el seguimiento documental y los controles del proceso de aprovisionamiento, aplicando los mecanismos previstos en el programa y utilizando aplicaciones informáticas.
  criterios:

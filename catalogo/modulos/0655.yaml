      es: Se han elaborado informes de evaluación de proveedores de manera clara y estructurada.
  - letra: g
    texto:
      es: Se ha elaborado la documentación relativa al control, registro e intercambio de información con proveedores, siguiendo los procedimientos de calidad y utilizando aplicaciones informáticas.
  - letra: h
    texto:
      es: Se han determinado los flujos de información, relacionando los departamentos de una empresa y los demás agentes logísticos que intervienen en la actividad de aprovisionamiento.
  - letra: i

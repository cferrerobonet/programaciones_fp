      es: Se ha operado de forma ordenada, con pulcritud, precisión y seguridad, aplicando los procedimientos y técnicas adecuadas.
- 'n': 4
  texto:
    es: Realiza el mantenimiento y limpieza de los equipos y herramientas del proceso de preparación de superficies aplicando los procedimientos establecidos.
  criterios:

ra:
- 'n': 1
  texto:
    es: Prepara superficies de acero y plástico del vehículo, analizando las características de los materiales empleados y aplicando técnicas establecidas.
  criterios:
  - letra: a
    texto:
      es: Se ha localizado el daño por procedimientos visuales, táctiles y con paso de lija, comprobando el grado de severidad del mismo (leve, medio y grave).
  - letra: b
    texto:
      es: Se ha eliminado la pintura del vehículo utilizando los equipos adecuados y el abrasivo conveniente según su grano y características.
  - letra: c
    texto:
      es: Se han comprobado los equipos de lijado a máquina, relacionando sus características estructurales y funcionamiento.
  - letra: d
    texto:
      es: Se han preparado los bordes de la zona que se va a pintar según los procedimientos establecidos
  - letra: e
    texto:
      es: Se ha procedido a la limpieza y desengrasado de la zona, relacionando los productos químicos de limpieza con la naturaleza del material.
  - letra: f
    texto:
      es: Se han reparado los daños leves con masilla, empleando los productos de relleno adecuados en la reparación y siguiendo los procedimientos establecidos.
  - letra: g
    texto:
      es: Se ha ejecutado la mezcla de los componentes seleccionados, masilla de relleno y catalizador para efectuar la reparación, interpretando las fichas técnicas del producto.
  - letra: h
    texto:
      es: Se ha secado con infrarrojos y lijado la masilla con el sistema más adecuado (a mano o a máquina).
  - letra: i
    texto:
      es: Se han subsanado los fallos tomando las medidas para que éstos no se repitan.
  - letra: j
    texto:
      es: Se ha limpiado y desengrasado la zona convenientemente, verificando la adecuada preparación de la superficie y teniendo en cuanta el reciclado de los residuos generados.
  - letra: k
    texto:
      es: Se ha operado de forma ordenada, con pulcritud, precisión y seguridad, aplicando los procedimientos y técnicas adecuadas en condiciones de higiene.
- 'n': 2
  texto:
    es: Realiza operaciones de enmascarado y desenmascarado, identificando y seleccionando el procedimiento requerido.
  criterios:
  - letra: a
    texto:
      es: Se han protegido con el enmascarado las zonas adyacentes a las que se van a pintar con la habilidad y destreza adecuada.
  - letra: b
    texto:
      es: Se ha elegido el material a emplear, relacionando las características funcionales del material con la superficie a enmascarar.
  - letra: c
    texto:
      es: Se han identificado las zonas a pintar para enmascarar lo que sea estrictamente necesario.
  - letra: d
    texto:
      es: Se ha desenmascarado la zona con precaución de no originar daños, siguiendo las especificaciones técnicas.
  - letra: e
    texto:
      es: Se ha utilizado convenientemente adhesivos de sujeción del enmascarado con las precauciones pertinentes.
  - letra: f
    texto:
      es: Se ha colocado el burlete en la zona adecuada, asegurando la hermeticidad y eligiendo el diámetro adecuado.
  - letra: g
    texto:
      es: Se ha operado de forma ordenada, con pulcritud y precisión, aplicando los procedimientos y técnicas adecuadas.
  - letra: h
    texto:
      es: Se ha comprobado que la zona que tiene que estar enmascarada es la adecuada, corrigiendo los fallos y aplicando procedimientos y técnicas apropiadas.
- 'n': 3
  texto:

ra:
- 'n': 1
  texto:
    es: Replantea infraestructuras de sistemas de telecomunicaciones, interpretando planos de edificación y esquemas de la instalación y relacionando redes de cableado, equipos y elementos con su lugar de ubicación.
  criterios:
  - letra: a
    texto:
      es: Se ha verificado la coincidencia entre los datos de los planos y la ubicación de las instalaciones.
  - letra: b
    texto:
      es: Se ha verificado que los espacios (recintos, registro, arquetas y lugar de ubicación de los elementos de captación de señales, entre otros) son los indicados en la documentación.
  - letra: c
    texto:
      es: Se han tenido en cuenta las características específicas de los tipos de instalación.
  - letra: d
    texto:
      es: Se ha comprobado que el trazado de la instalación no interfiere con otras instalaciones existentes o previstas.
  - letra: e
    texto:
      es: Se han relacionado los espacios y elementos de la instalación con su lugar de ubicación.
  - letra: f
    texto:
      es: Se han identificado posibles contingencias y planteado soluciones.
  - letra: g
    texto:
      es: Se ha marcado el trazado de la instalación en planos y/u obra.
  - letra: h
    texto:
      es: Se han tenido en cuenta los reglamentos y normas de aplicación en el replanteo.
- 'n': 2
  texto:
    es: Monta conjuntos captadores de señales de radiodifusión sonora y de televisión para emisiones terrestres y de satélite, interpretando planos y esquemas de montaje y aplicando técnicas específicas.
  criterios:
  - letra: a
    texto:
      es: Se han seleccionado los equipos y herramientas de montaje de antenas y mástiles.
  - letra: b
    texto:
      es: Se han montado elementos soporte de las antenas y sus elementos de fijación.
  - letra: c
    texto:
      es: Se han montado antenas para radiodifusión sonora y televisión.
  - letra: d
    texto:
      es: Se ha verificado la dirección de máxima señal.
  - letra: e
    texto:
      es: Se han orientado las antenas.
  - letra: f
    texto:
      es: Se han montado los elementos activos o pasivos para entregar la señal al equipo de cabecera.
  - letra: g
    texto:
      es: Se han conectado los mástiles de antena a la toma de tierra.
- 'n': 3
  texto:
    es: Monta el equipamiento de cabecera, describiendo la función de cada elemento y aplicando técnicas específicas.
  criterios:
  - letra: a
    texto:
      es: Se han montado bases soporte de fijación mural o racks para ubicar los equipos.
  - letra: b
    texto:
      es: Se han seleccionado los elementos en función del tipo de cabecera.
  - letra: c
    texto:
      es: Se han montado los elementos del equipo de cabecera (mezcladores de señales, conversores y separadores, entre otros) necesarios para procesar las señales.
  - letra: d
    texto:
      es: Se han conexionado los elementos del equipo de cabecera.
  - letra: e
    texto:
      es: Se han montado la alimentación del sistema.
  - letra: f
    texto:
      es: Se han verificado las características que debe presentar la instalación a la salida (impedancia y nivel máximo, entre otros).
  - letra: g
    texto:
      es: Se han configurado los elementos del sistema.
- 'n': 4
  texto:
    es: Instala los elementos de la red de distribución para señales de radio y televisión, interpretando planos o esquemas de su estructura y aplicando técnicas específicas de montaje.
  criterios:
  - letra: a
    texto:
      es: Se ha tendido el cableado de la red de distribución.
  - letra: b
    texto:
      es: Se ha tendido el cableado de la red de dispersión.
  - letra: c
    texto:
      es: Se ha tendido el cableado de la red interior de usuario.
  - letra: d
    texto:
      es: Se han montado derivadores y distribuidores.
  - letra: e
    texto:
      es: Se han montado las tomas de usuario (bases de acceso terminal).
  - letra: f
    texto:
      es: Se han montado los puntos de acceso de usuario.
  - letra: g
    texto:
      es: Se han conexionado los cables de la red.
  - letra: h
    texto:
      es: Se han verificado los valores de las características de la red.
- 'n': 5
  texto:
    es: Instala la infraestructura común de telecomunicaciones para el acceso al servicio de telefonía disponible al público (telefonía básica y través de una red digital de servicios integrados), interpretando planos o esquemas y aplicando técnicas específicas de montaje.
  criterios:
  - letra: a
    texto:
      es: Se ha identificado el método de enlace utilizado por los operadores.
  - letra: b
    texto:
      es: Se han identificado los tipos de acceso (acceso básico RDSI o acceso primario RDSI).
  - letra: c
    texto:
      es: Se han identificado los dos casos del acceso primario, teniendo en cuenta la ubicación del TR1 p.
  - letra: d
    texto:
      es: Se han individualizado, hasta la TR1 p, los cables de emisión y recepción.
  - letra: e
    texto:
      es: Se han montado los registros de terminación de red para telefonía básica (TB) y la red digital de servicios integrados (RDSI).
  - letra: f
    texto:
      es: Se han instalado diferentes configuraciones de cableado para RDSI (bus pasivo corto, bus pasivo ampliado y punto a punto).
  - letra: g
    texto:
      es: Se han montado los elementos de los puntos de distribución.
  - letra: h
    texto:
      es: Se ha montado la intercomunicación y control de acceso.
- 'n': 6
  texto:
    es: Instala infraestructuras de redes de banda ancha, interpretando planos y esquemas de su estructura y aplicando técnicas de montaje.
  criterios:
  - letra: a
    texto:
      es: Se ha replanteado la instalación de acuerdo a los planos.
  - letra: b
    texto:
      es: Se ha instalado el cableado troncal (subsistema de campus).
  - letra: c
    texto:
      es: Se ha instalado el cableado vertical (subsistema de edificios).
  - letra: d
    texto:
      es: Se ha instalado el cableado horizontal.
  - letra: e
    texto:
      es: Se han montado distribuidores de campus y de edificio de planta, entre otros.
  - letra: f
    texto:
      es: Se han montado los equipos de los recintos de telecomunicaciones y cuartos de equipos.
  - letra: g
    texto:
      es: Se han realizado pruebas y medidas de parámetros relacionados con certificaciones.
  - letra: h
    texto:
      es: Se han elaborado esquemas de las posibles modificaciones.
- 'n': 7
  texto:
    es: Verifica el funcionamiento de las infraestructuras de sistemas de telecomunicaciones, efectuando medidas y contrastándolas con los parámetros normativos.
  criterios:
  - letra: a
    texto:
      es: Se han seleccionado las herramientas e instrumental de medida.
  - letra: b
    texto:
      es: Se han efectuado medidas, ajustes y ensayos de funcionamiento.
  - letra: c
    texto:
      es: Se han interpretado los resultados obtenidos en las medidas.
  - letra: d
    texto:
      es: Se ha comprobado que los parámetros de la instalación cumplen la normativa o están de acuerdo a estándares.
  - letra: e
    texto:
      es: Se han ajustado equipos de acuerdo a parámetros normativos.
  - letra: f
    texto:
      es: Se han contrastado los resultados obtenidos.
- 'n': 8
  texto:
    es: Mantiene instalaciones de infraestructuras de sistemas de telecomunicaciones, efectuando mediciones y corrigiendo averías o disfunciones.
  criterios:
  - letra: a
    texto:
      es: Se ha realizado el plan de intervención en el sistema para la detección de fallos y averías, de acuerdo a la instalación.
  - letra: b
    texto:
      es: Se han realizado pruebas y medidas según la tipología del sistema.
  - letra: c
    texto:
      es: Se han interpretado las medidas realizadas, señalando las posibles disfunciones.
  - letra: d
    texto:
      es: Se han aplicado técnicas de diagnóstico y localización de averías según tipología y características de la instalación.
  - letra: e
    texto:
      es: Se han propuesto hipótesis de las causas y repercusión de averías.
  - letra: f
    texto:
      es: Se han sustituido equipos o partes de la instalación.
  - letra: g
    texto:
      es: Se ha verificado la restitución del funcionamiento en caso de avería.
  - letra: h
    texto:
      es: Se han realizado las operaciones de mantenimiento preventivo.
- 'n': 9
  texto:
    es: Cumple las normas de prevención de riesgos laborales y de protección ambiental, identificando los riesgos asociados, las medidas y equipos para prevenirlos.
  criterios:
  - letra: a
    texto:
      es: Se han identificado los riesgos y el nivel de peligrosidad que supone la manipulación de los materiales, herramientas, útiles y máquinas.
  - letra: b
    texto:
      es: Se han utilizado las máquinas respetando las normas de seguridad.
  - letra: c
    texto:
      es: Se han identificado las causas más frecuentes de accidentes en la manipulación de materiales y herramientas, entre otros.
  - letra: d
    texto:
      es: Se han descrito los elementos de seguridad de las máquinas (protecciones, alarmas y paros de emergencia, entre otros) y los equipos de protección individual (calzado, protección ocular e indumentaria, entre otros) que se deben emplear en las distintas operaciones de montaje y mantenimiento.
  - letra: e
    texto:
      es: Se ha relacionado la manipulación de materiales, herramientas y máquinas con las medidas de seguridad y protección personal requeridas.
  - letra: f
    texto:
      es: Se han determinado las medidas de seguridad y de protección personal que se deben adoptar en la preparación y ejecución de las operaciones de montaje y mantenimiento de los sistemas de telefonía.
  - letra: g
    texto:
      es: Se han identificado las posibles fuentes de contaminación del entorno ambiental.
  - letra: h
    texto:
      es: Se han clasificado los residuos generados para su retirada selectiva.
  - letra: i
    texto:
      es: Se ha valorado el orden y la limpieza de instalaciones y equipos como primer factor de prevención de riesgos.
contenidos:
- titulo:
    es: Replanteo de infraestructuras de sistemas de telecomunicaciones
  puntos:
  - es: Verificación de datos. Proyecto técnico. Memoria. Comprobación de las especificaciones. Otros.
  - es: Descripción de la edificación. Recintos. Características de los recintos por dominio de ubicación. Arqueta de entrada. Recinto inferior. Recinto superior. Otros.
  - es: Cumplimiento de las especificaciones en viviendas, bloques de pisos y conjunto de viviendas unifamiliares. Topologías según tipo de inmueble. Verificación.
  - es: Verificación de los trazados de otras instalaciones. Interferencia entre instalaciones.
  - es: Colocación y ubicación de elementos comunes. Relación con las normas de edificación aplicadas a instalaciones comunes.
  - es: Identificación de contingencias. Planeamiento de soluciones.
  - es: Marcado y trazado sobre planos y obra de la instalación. Replanteo de la instalación. Condiciones de obra.
  - es: Norma específica de las instalaciones comunes en edificios. Instrucciones técnicas del REBT referente a instalaciones comunes de telecomunicaciones.
- titulo:
    es: Montaje de conjuntos captadores de señales de radiodifusión sonora y de televisión para emisiones terrestres y de satélite
  puntos:
  - es: Proyecto técnico. Memoria. Materiales y herramientas para el montaje de elementos accesorios de antenas. Mástiles. Torretas.
  - es: Técnicas de montaje de soportes, accesorios y elementos de fijación de antenas.
  - es: Técnicas de montaje de antenas terrestres para radio y televisión. Apuntamiento y orientación de antenas. Técnicas de montaje de antenas para televisión vía satélite. Apuntamiento y orientación de antenas.
  - es: Técnicas de montaje de los elementos activos y pasivos.
  - es: Conexionado eléctrico. Tomas de tierra.
  - es: Normas de seguridad y prevención de riesgos.
- titulo:
    es: Montaje del equipamiento de cabecera
  puntos:
  - es: Técnicas de montaje de instalaciones de equipamiento de cabecera para señales de radio y televisión. Elementos que hay que instalar. Descripción del funcionamiento.
  - es: Tipos de cabecera. Selección de elementos. Descripción del funcionamiento.
  - es: Elementos de cabecera. Técnicas de montaje de elementos. Conversores, Separadores. Amplificadores de FI. Moduladores. Otros. Descripción del funcionamiento.
  - es: 'Equipamiento eléctrico: protecciones y toma de tierra.'
  - es: Verificación de las características de la instalación. Nivel máximo. Impedancia.
  - es: Configuración de los elementos de cabecera. Configuración local.
- titulo:
    es: Instalación de los elementos de la red de distribución para señales de radio y televisión
  puntos:
  - es: Proyecto técnico. Memoria.
  - es: Comprobación de canalizaciones. Canalización de enlace. Principal. Secundaria. Interior de usuario.
  - es: 'Líneas de transmisión: fibra óptica, cable coaxial, par trenzado, entre otros. Normalización. Tipos de conductores. Características especiales de los conductores empleados en ICT atendiendo al tipo de local.'
  - es: Distribución por repartidores. Distribución por derivadores. Distribución por cajas de paso. Distribución mixta.
  - es: Técnicas de montaje de tomas de usuario, bases y puntos de acceso.
  - es: Técnicas de conexionado de cableado. Fibra óptica. Conectores.
  - es: Técnicas de verificación de las características de la instalación.
  - es: Normas de seguridad personal y de los equipos.
- titulo:
    es: Instalación de la infraestructura común de telecomunicaciones para el acceso al servicio de telefonía disponible al público
  puntos:
  - es: Proyecto técnico. Memoria.
  - es: Características del método de enlace de los operadores de telecomunicaciones. Descripción.
  - es: Elementos para el acceso al servicio de telefonía disponible al público.
  - es: Equipos para accesos básicos. Equipos para accesos primarios. Características de los accesos. Básico. RDSI o acceso primario.
  - es: Características de los elementos de telefonía y redes de voz. Regletas de corte y pruebas. Convertidores.
  - es: Técnicas de individualización de cables para TR1 p.
  - es: Técnicas de montaje de los registros de terminación de red para telefonía básica y RDSI. Descripción de elementos.
  - es: Puntos de distribución. Técnicas de montaje.
  - es: Configuración del cableado. Bus pasivo corto. Bus pasivo ampliado. Punto a punto.
  - es: Técnicas de montaje de instalaciones de intercomunicación y accesos. Instalación de Porteros automáticos. Armarios. Accesorios. Características de los elementos de interfonía y videopotería. Placas de calle. Porteros GSM. Videoporteros.
- titulo:
    es: Instalación de infraestructuras de redes de banda ancha
  puntos:
  - es: Proyecto técnico. Memoria. Planos. Descripción de la edificación. Descripción de los servicios. Previsión de demanda. Otros.
  - es: Medios guiados. Acceso al servicio de telecomunicaciones de banda ancha. Cableado estructurado. Conexionado y conectores específicos.
  - es: Técnicas de cableado en subsistemas de campus y edificios.
  - es: Características de los elementos de telefonía redes de datos. Regletas. Electrónica de red. Convertidores.
  - es: Técnicas de montaje de equipos en recintos de telecomunicaciones. Instalación de equipos en «rack».
  - es: Medidas específicas de certificación. Técnicas. Interpretación de resultados.
  - es: Elaboración de esquemas. Software de aplicación.
- titulo:
    es: Verificación del funcionamiento de las infraestructuras de sistemas de telecomunicaciones
  puntos:
  - es: Plan de puesta en servicio. Protocolo de medidas.
  - es: Parámetros de funcionamiento en las instalaciones de ICT.
  - es: Instrumentos y procedimientos de medida en instalaciones de ICT.
  - es: Ajustes y puesta a punto.
  - es: Señal según orientación de los elementos de captación de señales. Medidas.
  - es: Técnicas de ajuste en local y de forma remota. Verificación de comunicación. Parámetros significativos en el ajuste de instalaciones de ICT.
  - es: Medidas y ensayos de funcionamiento en infraestructuras de radio y TV, telefonía y redes de voz y datos.
  - es: Interpretación de resultados. Cotejo de valores según documentación técnica.
  - es: Verificaciones reglamentarias. Documentación.
- titulo:
    es: Mantenimiento de instalaciones de infraestructuras de sistemas de telecomunicaciones
  puntos:
  - es: Detección de averías en infraestructuras de sistemas de telecomunicaciones.
  - es: Procedimientos de medidas. Pruebas. Tipología de las instalaciones que hay que mantener.
  - es: Técnicas de diagnóstico y localización de averías. Sustitución y configuración de elementos defectuosos.
  - es: Comprobación y restitución del servicio en las infraestructuras de telecomunicaciones en edificios. Técnicas de monitorización de redes y sistemas.
  - es: Planes de mantenimiento en sistemas de infraestructuras de telecomunicaciones.
  - es: Documentación de las intervenciones realizadas. Históricos de averías.
- titulo:
    es: Prevención de riesgos, seguridad y protección medioambiental
  puntos:
  - es: Normativa de prevención de riesgos laborales relativa a los sistemas de telefonía.
  - es: Prevención de riesgos laborales en los procesos de montaje y mantenimiento.
  - es: Equipos de protección individual. Características y criterios de utilización. Protección colectiva. Medios y equipos de protección.
  - es: Normativa reguladora en gestión de residuos.

ra:
- 'n': 1
  texto:
    es: Contabiliza en soporte informático los hechos contables derivados de las operaciones de trascendencia económico-financiera de una empresa, cumpliendo con los criterios establecidos en el Plan General de Contabilidad (PGC).
  criterios:
  - letra: a
    texto:
      es: Se ha comprobado la correcta instalación de las aplicaciones informáticas y su funcionamiento.
  - letra: b
    texto:
      es: Se han seleccionado las prestaciones, funciones y procedimientos de las aplicaciones informáticas que se deben emplear para la contabilización.
  - letra: c
    texto:
      es: Se han caracterizado las definiciones y las relaciones contables fundamentales establecidas en los grupos, subgrupos y cuentas principales del PGC.
  - letra: d
    texto:
      es: Se han registrado, en asientos por partida doble, las operaciones más habituales relacionadas con los grupos de cuentas descritos anteriormente.
  - letra: e
    texto:
      es: Se han clasificado los diferentes tipos de documentos mercantiles que exige el PGC, indicando la clase de operación que representan.
  - letra: f
    texto:
      es: Se ha verificado el traspaso de la información entre las distintas fuentes de datos contables.
  - letra: g
    texto:
      es: Se ha identificado la estructura y forma de elaboración del balance de comprobación de sumas y saldos.
  - letra: h
    texto:
      es: Se han realizado copias de seguridad para la salvaguarda de los datos.
- 'n': 2
  texto:
    es: Realiza la tramitación de las obligaciones fiscales y contables relativas al Impuesto de Sociedades y el Impuesto sobre la Renta de las Personas Físicas, aplicando la normativa de carácter mercantil y fiscal vigente.
  criterios:
  - letra: a
    texto:
      es: Se ha analizado la normativa fiscal vigente y las normas aplicables en cada tipo de impuesto.
  - letra: b
    texto:
      es: Se han seleccionado los modelos establecidos por la Hacienda Pública para atender el procedimiento de declaración-liquidación de los distintos impuestos.
  - letra: c
    texto:
      es: Se han identificado los plazos establecidos por la Hacienda Pública para cumplir con las obligaciones fiscales.
  - letra: d
    texto:
      es: Se han realizado los cálculos oportunos para cuantificar los elementos tributarios de los impuestos que gravan la actividad económica.
  - letra: e
    texto:
      es: Se ha cumplimentado la documentación correspondiente a la declaración-liquidación de los distintos impuestos, utilizando aplicaciones informáticas de gestión fiscal.
  - letra: f
    texto:
      es: Se han generado los ficheros necesarios para la presentación telemática de los impuestos, valorando la eficiencia de esta vía.
  - letra: g
    texto:
      es: Se han relacionado los conceptos contables con los aspectos tributarios.
  - letra: h
    texto:
      es: Se ha diferenciado entre resultado contable y resultado fiscal y se han especificado los procedimientos para la conciliación de ambos.
  - letra: i
    texto:
      es: Se han contabilizado los hechos contables relacionados con el cumplimiento de las obligaciones fiscales, incluyendo los ajustes fiscales correspondientes.
  - letra: j
    texto:
      es: Se han descrito y cuantificado, en su caso, las consecuencias de la falta de rigor en el cumplimiento de las obligaciones fiscales.
- 'n': 3
  texto:
    es: Registra contablemente las operaciones derivadas del fin del ejercicio económico a partir de la información y documentación de un ciclo económico completo, aplicando los criterios del PGC y la legislación vigente.
  criterios:

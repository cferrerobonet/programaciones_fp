  - letra: c
    texto:
      es: Se han utilizado los tipos de guías pasacables, indicando la forma óptima de sujetar cables y guía.
  - letra: d
    texto:
      es: Se ha cortado y etiquetado el cable.
  - letra: e
    texto:
      es: Se han montado los armarios de comunicaciones y sus accesorios.
  - letra: f
    texto:
      es: Se han montado y conexionado las tomas de usuario y paneles de parcheo.
  - letra: g
    texto:
      es: Se ha trabajado con la calidad y seguridad requeridas.

ra:
- 'n': 1
  texto:
    es: Selecciona los elementos que configuran las redes para la transmisión de voz y datos, describiendo sus principales características y funcionalidad.
  criterios:
  - letra: a
    texto:
      es: Se han identificado los tipos de instalaciones relacionados con las redes de transmisión de voz y datos.
  - letra: b
    texto:
      es: Se han identificado los elementos (canalizaciones, cableados, antenas, armarios, «racks» y cajas, entre otros) de una red de transmisión de datos.
  - letra: c
    texto:
      es: Se han clasificado los tipos de conductores (par de cobre, cable coaxial, fibra óptica, entre otros).
  - letra: d
    texto:
      es: Se ha determinado la tipología de las diferentes cajas (registros, armarios, «racks», cajas de superficie, de empotrar, entre otros).
  - letra: e
    texto:
      es: Se han descrito los tipos de fijaciones (tacos, bridas, tornillos, tuercas, grapas, entre otros) de canalizaciones y sistemas.
  - letra: f
    texto:
      es: Se han relacionado las fijaciones con el elemento a sujetar.
- 'n': 2
  texto:
    es: Monta canalizaciones, soportes y armarios en redes de transmisión de voz y datos, identificando los elementos en el plano de la instalación y aplicando técnicas de montaje.
  criterios:
  - letra: a
    texto:
      es: Se han seleccionado las técnicas y herramientas empleadas para la instalación de canalizaciones y su adaptación.
  - letra: b
    texto:
      es: Se han tenido en cuenta las fases típicas para el montaje de un «rack».
  - letra: c
    texto:
      es: Se han identificado en un croquis del edificio o parte del edificio los lugares de ubicación de los elementos de la instalación.
  - letra: d
    texto:
      es: Se ha preparado la ubicación de cajas y canalizaciones.
  - letra: e
    texto:
      es: Se han preparado y/o mecanizado las canalizaciones y cajas.
  - letra: f
    texto:
      es: Se han montado los armarios («racks») interpretando el plano.
  - letra: g
    texto:
      es: Se han montado canalizaciones, cajas y tubos, entre otros, asegurando su fijación mecánica.
  - letra: h
    texto:
      es: Se han aplicado normas de seguridad en el uso de herramientas y sistemas.
- 'n': 3
  texto:
    es: Despliega el cableado de una red de voz y datos analizando su trazado.
  criterios:
  - letra: a
    texto:
      es: Se han diferenciado los medios de transmisión empleados para voz y datos.
  - letra: b

      es: Se han calculado los gastos y comisiones devengados en cada producto.
  - letra: d
    texto:
      es: Se ha determinado el tratamiento fiscal de cada producto.
  - letra: e
    texto:
      es: Se ha determinado el tipo de garantía exigido por cada producto.
  - letra: f
    texto:
      es: Se han realizado informes comparativos de los costes financieros de cada uno de los productos de financiación propuestos.
  - letra: g
    texto:
      es: Se han comparado los servicios y las contraprestaciones de las distintas entidades financieras, resaltando las diferencias, ventajas e inconvenientes.
  - letra: h

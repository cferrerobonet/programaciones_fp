ra:
- 'n': 1
  texto:
    es: Determina las necesidades financieras y las ayudas económicas óptimas para la empresa, identificando las alternativas posibles.
  criterios:
  - letra: a
    texto:
      es: Se han comprobado los estados contables desde la óptica de las necesidades de financiación.
  - letra: b
    texto:
      es: Se han verificado informes económico-financieros y patrimoniales de los estados contables.
  - letra: c
    texto:
      es: Se han comparado los resultados de los análisis con los valores establecidos y se han calculado las desviaciones.
  - letra: d
    texto:
      es: Se han confeccionado informes de acuerdo con la estructura y los procedimientos, teniendo en cuenta los costes de oportunidad.
  - letra: e
    texto:
      es: Se han utilizado todos los canales de información y comunicación para identificar las ayudas públicas y/o privadas así como las fuentes a las que puede acceder la empresa.
  - letra: f
    texto:
      es: Se han identificado las características de las distintas formas de apoyo financiero a la empresa.
  - letra: g
    texto:
      es: Se ha contrastado la idoneidad y las incompatibilidades de las ayudas públicas y/o privadas estudiadas.
- 'n': 2
  texto:
    es: Clasifica los productos y servicios financieros, analizando sus características y formas de contratación.
  criterios:
  - letra: a
    texto:
      es: Se han identificado las organizaciones, entidades y tipos de empresas que operan en el sistema financiero.
  - letra: b
    texto:
      es: Se han precisado las instituciones financieras bancarias y no bancarias y descrito sus principales características.
  - letra: c
    texto:
      es: Se han detallado los aspectos específicos de los productos y servicios existentes en el mercado.
  - letra: d
    texto:
      es: Se han reconocido las variables que intervienen en las operaciones que se realizan con cada producto/servicio financiero.
  - letra: e
    texto:
      es: Se han identificado los sujetos que intervienen en las operaciones que se realizan con cada producto/servicio financiero.
  - letra: f
    texto:
      es: Se han relacionado las ventajas e inconvenientes de los distintos productos y servicios.
  - letra: g
    texto:
      es: Se ha determinado la documentación necesaria exigida y generada con la gestión de los diferentes productos y servicios financieros.
- 'n': 3
  texto:
    es: Evalúa productos y servicios financieros del mercado, realizando los cálculos y elaborando los informes oportunos.
  criterios:
  - letra: a
    texto:
      es: Se ha recogido información sobre productos y servicios financieros a través de los diferentes canales disponibles.
  - letra: b

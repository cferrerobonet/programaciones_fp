      es: Se ha contrastado el contenido de los presupuestos parciales.
  - letra: d
    texto:
      es: Se han verificado los cálculos aritméticos, comprobando la corrección de los mismos.
  - letra: e
    texto:
      es: Se ha valorado la importancia de elaborar en tiempo y forma la documentación relacionada con los presupuestos.
  - letra: f
    texto:
      es: Se ha controlado la ejecución del presupuesto y se han detectado las desviaciones y sus causas.
  - letra: g

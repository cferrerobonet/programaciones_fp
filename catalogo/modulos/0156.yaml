      es: Se ha identificado el hilo argumental de mensajes orales y determinado los roles que aparecen en los mismos.
  - letra: c
    texto:
      es: Se ha reconocido la finalidad del mensaje, ya se trate de un mensaje directo, telefónico o en cualquier otro medio auditivo.
  - letra: d
    texto:
      es: Se ha extraído información específica contenida en discursos orales, en lengua estándar, relacionados con la vida social, profesional o académica.
  - letra: e
    texto:
      es: Se han secuenciado los elementos constituyentes del mensaje.
  - letra: f
    texto:
      es: Se han identificado y resumido con claridad las ideas principales de un discurso sobre temas conocidos, transmitido por los medios de comunicación y emitido en lengua estándar.
  - letra: g
    texto:
      es: Se han reconocido las instrucciones orales y se han seguido las indicaciones siendo capaz de concluir si precisan de una respuesta verbal o de una no verbal.
  - letra: h
    texto:
      es: Se ha tomado conciencia de la importancia de comprender globalmente un mensaje, sin necesidad de entender todos y cada uno de los elementos del mismo.
  - letra: i
    texto:
      es: Se ha servido del análisis de la entonación y de los elementos visuales para identificar los diversos significados e intenciones comunicativas del emisor.

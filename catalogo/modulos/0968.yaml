  - letra: h
    texto:
      es: Se han identificado los requerimientos mínimos para la puesta en marcha de la instalación.
  - letra: i
    texto:
      es: Se han realizado las medidas necesarias para el análisis de la red de suministro (detección de armónicos y perturbaciones).
  - letra: j

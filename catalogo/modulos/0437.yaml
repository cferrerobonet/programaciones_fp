- 'n': 1
  texto:
    es: Selecciona técnicas de comunicación, relacionándolas con la estructura e imagen de la empresa y los flujos de información existentes en ella.
  criterios:
  - letra: a
    texto:
      es: Se ha reconocido la necesidad de comunicación entre las personas.
  - letra: b
    texto:
      es: Se ha distinguido entre comunicación e información.
  - letra: c
    texto:
      es: Se han distinguido los elementos y procesos que intervienen en la comunicación.
  - letra: d
    texto:
      es: Se han reconocido los obstáculos que pueden existir en un proceso de comunicación.
  - letra: e
    texto:
      es: Se ha determinado la mejor forma y actitud a la hora de presentar el mensaje.
  - letra: f
    texto:

      es: Se han descrito las fases y procedimientos de apertura y acondicionado de zanjas.
  - letra: b
    texto:
      es: Se han descrito las fases y procedimientos de tendido de los cables directamente enterrados y bajo tubo.
  - letra: c
    texto:
      es: Se ha realizado un empalme de unión aérea-subterránea con manguito preaislado.
  - letra: d
    texto:
      es: Se han realizado derivaciones con conector a presión recubierto por cinta o manguito.
  - letra: e
    texto:
      es: Se han diagnosticado las causas de averías en líneas de redes subterráneas.
  - letra: f
    texto:
      es: Se han efectuado las medidas de parámetros característicos.
  - letra: g
    texto:
      es: Se ha elaborado un informe de las actividades realizadas y resultados obtenidos.
  - letra: h
    texto:
      es: Se han respetado los criterios de calidad.
- 'n': 7
  texto:
    es: Realiza operaciones de montaje y mantenimiento de instalaciones de enlace describiéndolas y aplicando las técnicas correspondientes.
  criterios:
  - letra: a
    texto:
      es: Se han identificado los procedimientos de montaje de las partes de la instalación (caja general de protección, línea general de alimentación, derivaciones individuales, entre otros)
  - letra: b
    texto:
      es: Se ha conexionado la caja general de protección de acuerdo con las instrucciones de montaje y reglamentación vigente.
  - letra: c
    texto:
      es: Se ha montado una línea general de alimentación de conductores aislados, bajo tubo, en montaje superficial.
  - letra: d
    texto:
      es: Se ha elaborado un croquis de centralización de contadores indicando la disposición de sus elementos y el cumplimiento de las dimensiones reglamentarias.
  - letra: e
    texto:
      es: Se han conexionado las unidades funcionales de una centralización de contadores sencilla con discriminación horaria.
  - letra: f
    texto:
      es: Se ha montado una derivación individual de conductores aislados, bajo tubo, en montaje superficial.
  - letra: g
    texto:
      es: Se han diagnosticado las causas de averías simuladas en una instalación eléctrica de enlace.
  - letra: h
    texto:
      es: Se han efectuado medidas de parámetros característicos.
  - letra: i

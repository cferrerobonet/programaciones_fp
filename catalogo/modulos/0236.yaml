      es: Se ha elaborado un informe de las actividades realizadas y resultados obtenidos.
  - letra: j
    texto:
      es: Se han respetado los criterios de calidad.
- 'n': 8
  texto:
    es: Cumple las normas de prevención de riesgos laborales y de protección ambiental, identificando los riesgos asociados, las medidas y equipos para prevenirlos.
  criterios:
  - letra: a
    texto:
      es: Se han identificado los riesgos y el nivel de peligrosidad que suponen la manipulación de los materiales, herramientas, útiles, máquinas y medios de transporte.
  - letra: b
    texto:
      es: Se han operado las máquinas respetando las normas de seguridad.
  - letra: c
    texto:
      es: Se han identificado las causas más frecuentes de accidentes en la manipulación de materiales, herramientas, máquinas de corte y conformado, entre otras.
  - letra: d
    texto:
      es: Se han descrito los elementos de seguridad (protecciones, alarmas, pasos de emergencia, entre otros) de las máquinas y los equipos de protección individual (calzado, protección ocular, indumentaria, entre otros) que se deben emplear en las distintas operaciones de mecanizado.
  - letra: e
    texto:
      es: Se ha relacionado la manipulación de materiales, herramientas y máquinas con las medidas de seguridad y protección personal requeridos.
  - letra: f
    texto:
      es: Se han determinado las medidas de seguridad y de protección personal que se deben adoptar en la preparación y ejecución de las operaciones de montaje y mantenimiento de instalaciones de enlace, redes de distribución en baja tensión y centros de transformación y sus instalaciones asociadas.
  - letra: g
    texto:
      es: Se han identificado las posibles fuentes de contaminación del entorno ambiental.
  - letra: h
    texto:
      es: Se han clasificado los residuos generados para su retirada selectiva.
  - letra: i
    texto:
      es: Se ha valorado el orden y la limpieza de instalaciones y equipos como primer factor de prevención de riesgos.
contenidos:
- titulo:

  - letra: d
    texto:
      es: 'En un supuesto práctico de valoración de una reparación de pintura, sobre vehículos reales o fotografías: ‐ Estimar la superficie dañada o deformada asignando el nivel de daño (sustitución, leve, medio, fuerte) incluidos en los distintos baremos de tiempos de reparación y tarifarios oficiales. ‐ Identificar los aspectos que incluyen o no las constantes para la valoración (tratamientos específicos, naturaleza del material a reparar, materiales de fondo específicos, tipo de pintura de acabado, entre otros). ‐ Hacer la valoración de los materiales a utilizar en cada caso en función del daño a reparar.'
- 'n': 8
  texto:

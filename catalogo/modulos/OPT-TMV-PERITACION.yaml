ra:
- 'n': 1
  texto:
    es: Analizar el tipo de deformación sufrida en piezas metálicas fijas o amovibles del vehículo determinando los distintos procesos de reparación y/o sustitución a emplear.
  criterios:
  - letra: a
    texto:
      es: Analizar el nivel de daño presentado por piezas metálicas aplicando las técnicas de diagnóstico utilizadas en carrocería (visual, mediante lijado, al tacto, por sistema de peines, entre otros).
  - letra: b
    texto:
      es: Elaborar un presupuesto inicial sin incluir desmontaje de elementos amovibles y fijos no estructurales.
  - letra: c
    texto:
      es: Manejar los baremos de tiempos y tarifarios oficiales examinando procesos y tiempos de reparación para su asignación.
  - letra: d
    texto:
      es: 'En un supuesto práctico de diagnosis previa de un vehículo accidentado analizando el alcance del daño en piezas metálicas amovibles o fijas no estructurales: ‐ Delimitar la zona dañada aplicando técnicas de detección de deformaciones (visual, al tacto, por comparación, por lijado, por sistema de peines, entre otros) considerando el tipo de material de la pieza. ‐ Valorar la magnitud del daño, teniendo en cuenta los criterios de profundidad y la extensión de la zona deformada. ‐ Acceder a la documentación de los fabricantes analizando los métodos de reparación homologados para cada tipo de daño eligiendo el más adecuado basándose en criterios técnicos y de rentabilidad.'
- 'n': 2
  texto:
    es: Analizar el tipo de deformación sufrida en piezas plásticas o sintéticas fijas y amovibles del vehículo determinando los distintos procesos de reparación y/o sustitución a emplear.
  criterios:
  - letra: a
    texto:
      es: Describir las técnicas de identificación de material plástico y/o sintético relacionándolas con las piezas a reparar.
  - letra: b
    texto:
      es: Exponer las técnicas de diagnóstico utilizadas en piezas plásticas y/o sintéticas (visual, mediante lijado, al tacto, por comparación, entre otras) que permiten identificar la deformación sufrida.
  - letra: c
    texto:
      es: Manejar los baremos de tiempos y tarifarios oficiales identificando procesos y tiempos de reparación para su asignación.
  - letra: d
    texto:
      es: 'En un supuesto práctico de diagnosis previa de un vehículo accidentado analizando el alcance del daño de una pieza plástica y/o sintética en la carrocería de un vehículo accidentado: ‐ Delimitar la zona dañada aplicando técnicas de detección de deformaciones (visual, al tacto, por comparación, por lijado, por sistema de peines, entre otros) considerando el tipo de material de la pieza (plástico o compuesto). ‐ Valorar la magnitud del daño, teniendo en cuenta los criterios de profundidad y la extensión de la zona deformada. ‐ Acceder a la documentación de los fabricantes analizando los métodos de reparación homologados para cada tipo de daño eligiendo el más adecuado basándose en criterios técnicos y de rentabilidad.'
  - letra: e
    texto:
      es: 'En un supuesto práctico de planificación de la reparación de daños en elementos plásticos o sintéticos amovibles y/o fijos no estructurales definiendo el proceso de trabajo: ‐ Determinar los procesos y tareas de reparación a realizar en cada vehículo a partir de la información de los fabricantes. ‐ Obtener los tiempos de reparación de cada proceso consultando los baremos oficiales. ‐ Elaborar el presupuesto de la reparación considerando la totalidad de las variables que intervienen.'
- 'n': 3
  texto:
    es: Aplicar técnicas de organización y control en los procesos de reparación de elementos amovibles y fijos no estructurales utilizando la documentación y las herramientas necesarias para alcanzar el rendimiento y la productividad preestablecidos.
  criterios:
  - letra: a
    texto:
      es: Explicar los documentos de programación necesarios para la organización de la producción mediante la aplicación de programas y otros paquetes informáticos.
  - letra: b
    texto:
      es: 'En un supuesto práctico de supervisión de una reparación de daños en elementos amovibles y/o fijos no estructurales verificando la calidad final de la reparación: ‐ Verificar que las fases de la reparación en curso avanzan ajustándose a los tiempos programados contrastando los tiempos previstos con los tiempos registrados en la documentación de control del taller. ‐ Controlar la calidad final del trabajo realizado comprobando que la reparación cumple los criterios técnicos indicados por los fabricantes. - Calcular el presupuesto de la reparación, desglosando importe de la mano de obra, e identificando los recambios necesarios y su importe correspondiente.'
- 'n': 4
  texto:
    es: Analizar la constitución de las carrocerías (chasis separado, carrocería autoportante, carrocería combinada, pick‐up, entre otros) relacionándolas con los procedimientos de reparación.
  criterios:
  - letra: a
    texto:
      es: Analizar el nivel de daño presentado por piezas metálicas estructurales aplicando las técnicas de diagnóstico utilizadas en carrocería (visual, mediante lijado, al tacto, por sistema de peines, entre otros).
  - letra: b
    texto:
      es: Identificar en la información de los fabricantes las técnicas recomendadas para la reparación en piezas metálicas estructurales (tracción, compresión, tiros, reenvíos, contratiros y combinación de ambos) explicando las pautas de trabajo en cada una de ellos.
  - letra: c
    texto:
      es: Identificar los parámetros (puntos de referencia, de deformación programada, entre otros) que se deben comprobar en el diagnóstico de una estructura dañada interpretando la documentación técnica de los fabricantes de vehículos y de equipos de control de cotas de las carrocerías.
  - letra: d
    texto:
      es: 'En un supuesto práctico de evaluación del alcance de los daños sobre una carrocería (autoportante, cabina, chasis, entre otros) mediante reconocimiento visual y/o con los equipos de control: ‐ Realizar un control visual inicial de arrugas teniendo en cuenta holguras y los puntos de deformación programada desmontando, en su caso, los elementos que puedan impedir o dificultar la diagnosis de la reparación. ‐ Medir el alcance de las deformaciones empleando los útiles de medida y control (compás de varas, galgas de nivel, sistemas de medición electrónicos, entre otros). ‐ Interpretar los valores de los parámetros obtenidos en las comprobaciones comparándolos con los dados en documentación técnica. ‐ Acceder a la documentación de los fabricantes analizando los métodos de reparación homologados para cada tipo de daño eligiendo el más adecuado basándose en criterios técnicos y de rentabilidad. ‐ Analizar la reparabilidad de las piezas dañadas teniendo en cuenta la información del fabricante (piezas que no admiten reparación, sustituciones parciales o totales, zonas de corte, entre otros). - Calcular el presupuesto de la reparación, desglosando importe de la mano de obra, e identificando los recambios necesarios y su importe correspondiente.'
- 'n': 5
  texto:
    es: Evaluar técnicas de reparación mediante la utilización de bancadas buscando que la estructura recupera sus cotas originales.
  criterios:

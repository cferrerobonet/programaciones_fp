      es: Interpretar la documentación técnica suministrada por los fabricantes de los productos de preparación de superficies calculando las cantidades de producto (imprimaciones, masillas, aparejos, entre otros) a preparar en función de la magnitud del daño, tipo de superficie y el tipo de acabado de la pintura deseado así como su coste.
  - letra: c

    texto:
      es: 'En un supuesto práctico de recepción y prediagnosis de un vehículo accidentado y/o averiado: ‐ Identificar el vehículo (marca, modelo, VIN, color, entre otros) registrando sus datos en la OR en el tipo de soporte manejado en el taller. ‐ Consultar la documentación facilitada por la marca, para el modelo del vehículo afectado identificando la forma de proceder en averías y siniestros concretos.'
  - letra: b
    texto:
      es: 'En un supuesto práctico de confección de un presupuesto de reparación de un vehículo dañado a partir de una diagnosis previa: ‐ Identificar las operaciones de reparación que se deben de realizar obtenidas a partir la diagnosis previa. ‐ Identificar las piezas afectadas directa e indirectamente por el siniestro a partir de la diagnosis previa realizada. ‐ Calcular el presupuesto de la reparación solicitada por el cliente a partir de las operaciones y recambios necesarios identificados, utilizando la documentación pertinente (manuales de recambios, tablas, baremos, guías, entre otros).'
  - letra: c
    texto:
      es: 'En un supuesto práctico de cumplimentación de una orden de reparación de un vehículo dañado: ‐ - Anotar los datos de identificación del cliente y del vehículo registrándolos en los apartados correspondientes del documento. ‐ Calcular el presupuesto de la reparación, desglosando importe de la mano de obra, e identificando los recambios necesarios y su importe correspondiente.'
- 'n': 11
  texto:
    es: Analizar técnicas de diagnosis, para la localización de averías, aplicándolas al mantenimiento de vehículos.
  criterios:
  - letra: a
    texto:
      es: Describir las técnicas de diagnóstico que comúnmente se emplean en la localización de averías.
  - letra: b
    texto:
      es: Calcular el presupuesto de la reparación, desglosando importe de la mano de obra, e identificando los recambios necesarios y su importe correspondiente.
- 'n': 12
  texto:
    es: Diagnosticar las posibles averías, simuladas o reales, que se pueden presentar en el funcionamiento de los sistemas eléctricos y electrónicos, de seguridad y confortabilidad determinando el procedimiento de mantenimiento que se debe aplicar en cada caso.
  criterios:
  - letra: a
    texto:
      es: 'En supuestos prácticos que impliquen el diagnóstico de averías en los sistemas eléctricos, de seguridad y confortabilidad. ‐Identificar los conjuntos o elementos que hay que comprobar, en los siguientes circuitos: Carga y arranque. Alumbrado y maniobra. Control y señalización. Auxiliares (limpiaparabrisas...) Seguridad y confortabilidad (Climatización, cierres centralizados, alarmas, equipos de sonido. de ayuda a la conducción,...) ‐Seleccionar la documentación técnica necesaria, relacionando planos y especificaciones. ‐Efectuar la selección, preparación y calibración del equipo o instrumento de medida, (bancos de comprobación de equipos de carga y arranque, equipo reglaje de faros, polímetro,...) realizando el conexionado sobre el sistema objeto de diagnóstico. ‐Comparar los valores de los parámetros obtenidos en las comprobaciones con los dados en documentación técnica, a fin de determinar los elementos que hay que reparar o sustituir. ‐Realizar el diagrama de secuenciación lógica del proceso de diagnóstico de la avería . ‐ Determinar la causa de la avería, relacionando la interacción existente entre diferentes sistemas. ‐Generar y evaluar diferentes alternativas de reparación en función del diagnóstico realizado, determinando el procedimiento que se debe utilizar. ‐ Realizar todas las operaciones respetando las normas de uso y seguridad que se deben cumplir y hacer cumplir. ‐ Consultar las unidades de auto diagnosis, comparando la información suministrada, con especificaciones técnicas. - Calcular el presupuesto de la reparación, desglosando importe de la mano de obra, e identificando los recambios necesarios y su importe correspondiente.'
- 'n': 13
  texto:
    es: Aplicar las técnicas inherentes al desarrollo de los procedimientos de mantenimiento, utilizando los equipos, herramientas, utillaje específico y medios requeridos.
  criterios:
  - letra: a
    texto:
      es: 'En casos prácticos que impliquen el desarrollo de operaciones de mantenimiento de sistemas eléctricos, electrónicos, de seguridad y de confortabilidad: ‐Realizar operaciones de desmontaje, montaje y reparación de conjuntos o elementos, según metodología establecida, utilizando los medios adecuados, en los sistemas eléctricos, electrónicos, de seguridad y de confortabilidad sin ser requerida gran destreza. ‐ Restituir los valores de los distintos parámetros a los indicados por las especificaciones técnicas. ‐ Identificar los fallos en alguno de los sistemas eléctricos, electrónicos, de seguridad y de confortabilidad, realizando la toma de medidas en los puntos adecuados para obtener valores característicos del circuito.'
- 'n': 14
  texto:
    es: Analizar la constitución y realizar el montaje de circuitos de fluidos, relacionando la función que cumplen los distintos elementos, con la operatividad del circuito, tanto de hidráulica y neumática básicas, como de hidráulica proporcional.
  criterios:
  - letra: a
    texto:
      es: Calcular pérdidas de carga en circuitos hidráulicos y neumáticos empleando tablas.
- 'n': 15
  texto:
    es: Diagnosticar las posibles averías, simuladas o reales, que se pueden presentar en el funcionamiento de los sistemas, determinando el procedimiento de mantenimiento que debe aplicarse en cada caso.
  criterios:
  - letra: a
    texto:
      es: 'En supuestos prácticos que impliquen el diagnóstico de averías en los sistemas del tren de rodaje y transmisión de fuerza: ‐ Identificar los conjuntos o elementos que hay que comprobar en los siguientes sistemas: -Embragues y convertidores. -Cambios manuales y automáticos. -Diferenciales y elementos de transmisión. -Suspensiones (convencionales, hidráulicas, inteligentes,...). -Direcciones (convencionales y asistidas). -Frenos (convencionales y con sistema antibloqueo, SDR...). -Seleccionar la documentación técnica necesaria, relacionando planos y especificaciones con el objeto de la reparación. -Efectuar la selección, preparación y calibración del equipo o instrumento de medida, (comprobador ABS, SDR..., equipos de alineación de dirección, equilibradora de ruedas y neumáticos...) realizando el conexionado o montaje sobre el sistema objeto de diagnóstico. Comparar los valores de los parámetros obtenidos en las comprobaciones con los dados en documentación técnica, a fin de determinar los elementos que se deben reparar o sustituir. Comparar los resultados del diagnóstico con los datos suministrados por las unidades de autodiagnosis en los sistemas dotados de ellas. Realizar el diagrama de secuenciación lógica del proceso de diagnosis de la avería -Determinar la causa de la avería relacionando la interacción existente entre diferentes sistemas. -Generar y evaluar diferentes alternativas de reparación en función del diagnóstico realizado determinando el procedimiento que hay que utilizar. -Calcular el presupuesto de la reparación, desglosando importe de la mano de obra, e identificando los recambios necesarios y su importe correspondiente.'
- 'n': 16
  texto:
    es: Diagnosticar las posibles averías, simuladas o reales, que se puedan presentar en el funcionamiento del motor térmico del vehículo y sus sistemas, determinando el procedimiento de mantenimiento que debe aplicarse en cada caso.
  criterios:
  - letra: a
    texto:
      es: 'En supuestos prácticos que impliquen el diagnóstico de averías de los motores térmicos y sus sistemas asociados: ‐Identificar los conjuntos o elementos que hay que comprobar en los siguientes sistemas: Conjunto motor. Sistema alimentación Refrigeración. Lubricación. Sistemas de encendido. Sobrealimentación y anticontaminación. ‐ Seleccionar la documentación técnica necesaria, relacionando planos y especificaciones. ‐Efectuar la selección, preparación y calibración del equipo o instrumento de medida, (banco diagnóstico comprobación inyección, equipo comprobación encendido, banco diagnosis motores...) realizando el conexionado sobre el sistema objeto de diagnóstico. ‐Comparar los valores de los parámetros obtenidos en las comprobaciones con los dados en documentación técnica, a fin de determinar los elementos que se deben reparar o sustituir. ‐ Comparar los resultados del diagnóstico con los datos suministrados por las unidades de gestión electrónica en los sistemas dotados de ellas. ‐ Realizar el diagrama de secuenciación lógica del proceso de diagnosis de la avería‐Determinar la causa de la avería relacionando la interacción existente de diferentes sistemas. ‐ Evaluar diferentes alternativas de reparación en función del diagnóstico realizado determinando el procedimiento que hay que utilizar. ‐Realizar todas las operaciones respetando las normas de uso y seguridad que ha de cumplir y hacer cumplir. -Calcular el presupuesto de la reparación, desglosando importe de la mano de obra, e identificando los recambios necesarios y su importe correspondiente.'
- 'n': 17
  texto:
    es: Realizar la recepción y entrega del vehículo, empleando técnicas de perfil comercial con los clientes, aplicando los procedimientos establecidos.
  criterios:
  - letra: a
    texto:
      es: 'En un supuesto práctico de recepción y prediagnosis de un vehículo accidentado y/o averiado: ‐Realizar la acogida, con atención personalizada, empatizando con el cliente. ‐Posicionar los elementos de protección de interiores del vehículo en presencia del cliente. ‐Identificar al cliente (nombre, apellidos, DNI, domicilio, teléfono y correo electrónico) incorporando sus datos a la OR en el tipo de soporte manejado en el taller. ‐Identificar el vehículo (marca, modelo, VIN, color, entre otros) registrando sus datos en la OR en el tipo de soporte manejado en el taller. ‐Realizar una inspección visual del estado del vehículo en el área de recepción observando los daños en la zona del golpe y los deterioros o daños existentes en zonas no afectadas por el golpe, correspondientes a otros siniestros o provenientes del normal uso del vehículo. ‐ Consultar la documentación facilitada por la marca, para el modelo del vehículo afectado identificando la forma de proceder en averías y siniestros concretos.'
  - letra: b
    texto:
      es: 'En un supuesto práctico de confección de un presupuesto de reparación de un vehículo dañado a partir de una diagnosis previa: ‐Identificar las piezas afectadas directa e indirectamente por el siniestro a partir de la diagnosis previa realizada. ‐ Decidir el modo operativo de reparación revisando los MR del fabricante. ‐Calcular el presupuesto de la reparación solicitada por el cliente a partir de las operaciones y recambios necesarios identificados, utilizando la documentación pertinente (manuales de recambios, tablas, baremos, guías, entre otros).'
  - letra: c
    texto:
      es: 'En un supuesto práctico de cumplimentación de una orden de reparación de un vehículo dañado: ‐ Detallar los daños que presenta el vehículo desglosando las operaciones a realizar y los repuestos que se van a solicitar en función de la reparación a desarrollar. ‐ Calcular el presupuesto de la reparación, desglosando importe de la mano de obra, e identificando los recambios necesarios y su importe correspondiente.'

- titulo:
    es: Elementos amovibles
  puntos:
  - es: Sistemas de roscas.
  - es: 'Tornillería utilizada en los vehículos: Tipos de tornillos, características, pasos, elementos que definen un tornillo, frenos, cálculo del taladro para los tornillos de rosca chapa. Grapas: tipos, sistemas de sujeción, cálculo del taladro para su montaje. Pegamento, masillas y adhesivos: tipos, características, utilización, preparación, catalizadores, activadores y reactivos. Remaches: Tipos, usos, cálculo del taladro, proceso de remachado. Preparación de las uniones. Procesos de montaje y desmontaje de elementos amovibles, tapizados y guarnecidos.'
- titulo:
    es: Elementos metálicos y sintéticos
  puntos:
  - es: 'Materiales sintéticos: métodos de obtención, características, utilización, simbología, identificación.'

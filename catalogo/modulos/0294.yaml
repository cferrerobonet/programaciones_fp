- titulo:
    es: Unión de elementos fijos
  puntos:
  - es: Elementos que constituyen una carrocería.
  - es: Técnicas de unión de elementos fijos. Procedimientos de montaje y desmontaje de elementos fijos. Preparación del hueco. Equipos de soldeo, gases y materiales de aportación. Procesos de soldeo con soldadura eléctrica por arco con electrodo revestido, MIG-MAG, MIG-Brazing, sinérgica para aluminio, puntos, y oxiacetilénica. Defectos en los procesos de soldeo. Pegado y engatillado de elementos.
- titulo:
    es: Transformaciones opcionales
  puntos:
  - es: Cálculo de costes de la transformación o elaboración del utillaje.
  - es: Documentación técnica inherente al montaje de elementos o sistemas sobre vehículos, de los fabricantes del equipo y del vehículo. Normativa de seguridad inherente a las transformaciones opcionales de vehículos.

ra:
- 'n': 1
  texto:
    es: Reconoce los equipos y elementos de las instalaciones de circuito cerrado de televisión y sistemas de seguridad electrónica, identificando las partes que los componen y las características más relevantes de los mismos.
  criterios:
  - letra: a
    texto:
      es: Se ha interpretado la normativa sobre instalaciones de circuito cerrado de televisión (CCTV) y detección electrónica (intrusión, fuego y gas, entre otras).
  - letra: b
    texto:
      es: Se han descrito los tipos de instalaciones de CCTV y detección electrónica (interior, exterior, video inteligente y detección activa, entre otros).
  - letra: c
    texto:
      es: Se han identificado los bloques funcionales de cada tipo de instalación.
  - letra: d
    texto:
      es: Se ha descrito la función específica de cada bloque funcional en el conjunto de la instalación.
  - letra: e
    texto:
      es: Se han relacionado los símbolos de los esquemas con los elementos reales.
  - letra: f
    texto:
      es: Se han descrito los equipos de transmisión de señal de alarma por cable e inalámbricos.
  - letra: g
    texto:
      es: Se han descrito las funciones y características de los equipos.
- 'n': 2
  texto:
    es: Configura pequeñas instalaciones de circuito cerrado de televisión y sistemas de seguridad electrónica, elaborando esquemas y seleccionando equipos y elementos.
  criterios:
  - letra: a
    texto:
      es: Se han identificado las especificaciones funcionales y técnicas de la instalación.
  - letra: b

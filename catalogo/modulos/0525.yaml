ra:
- 'n': 1
  texto:
    es: Caracteriza las instalaciones de las infraestructuras comunes de telecomunicaciones (ICT) para la captación, adaptación y distribución de señales de radiodifusión sonora y de televisión (emisiones terrestres y de satélite), analizando la normativa y describiendo la función y características de los espacios, equipos y elementos que la integran.
  criterios:
  - letra: a
    texto:
      es: Se han identificado los elementos y espacios que integran la ICT.
  - letra: b
    texto:
      es: Se han identificado el conjunto de elementos de captación de señales (antenas, mástiles, torretas y elementos de sujeción, entre otros).
  - letra: c
    texto:
      es: Se han identificado y reconocido sobre esquemas los elementos del equipo de cabecera.
  - letra: d
    texto:
      es: Se han relacionado los elementos del equipo de cabecera con los conjuntos de captación de señales.
  - letra: e
    texto:
      es: Se han identificado y reconocido sobre planos los tipos de redes (distribución, dispersión y de usuario).
  - letra: f
    texto:
      es: Se ha relacionado cada elemento de la ICT con su función y características.
- 'n': 2
  texto:
    es: Configura infraestructuras de telecomunicaciones para la captación, adaptación y distribución de señales de radiodifusión sonora y televisión, realizando cálculos y elaborando esquemas.
  criterios:
  - letra: a
    texto:
      es: Se han identificado las características físicas de los edificios para la instalación de la ICT.
  - letra: b
    texto:
      es: Se han ubicado en planos los elementos de captación, respetando las distancias a posibles obstáculos y a líneas eléctricas.
  - letra: c
    texto:
      es: Se han calculado los parámetros de los elementos y equipos.
  - letra: d
    texto:
      es: Se han seleccionado los elementos de captación en función de las características técnicas indicadas en la normativa (calidad de la señal, velocidad del viento, radiación e inmunidad, entre otras).
  - letra: e
    texto:
      es: Se han seleccionado los elementos activos y pasivos del equipo de cabecera, para el procesamiento de las señales.
  - letra: f
    texto:
      es: Se han dimensionado las redes que componen la infraestructura de comunicaciones.
  - letra: g
    texto:
      es: Se han dibujado esquemas (generales y de detalle) con la simbología normalizada.
  - letra: h
    texto:
      es: Se ha aplicado la normativa de ICT en la configuración de la instalación.
- 'n': 3
  texto:
    es: Caracteriza la infraestructura común de telecomunicaciones para el acceso al servicio básico de telefonía y redes digitales de servicios integrados, analizando la normativa y describiendo la función y características de los elementos que la integran.
  criterios:
  - letra: a
    texto:
      es: Se han identificado los tramos que constituyen la red de interior (red de alimentación, distribución, dispersión y red interior de usuario).
  - letra: b
    texto:
      es: Se han identificado las características de la instalación de acuerdo con método de enlace entre las centrales y el inmueble (mediante cable o medios radioeléctricos).
  - letra: c
    texto:
      es: Se han reconocido en planos los registros implicados dependiendo del método de enlace.
  - letra: d
    texto:
      es: Se han determinado los elementos de conexión (puntos de interconexión, punto de distribución, punto de acceso al usuario y bases de acceso terminal).
  - letra: e
    texto:
      es: Se han identificado los elementos y características de la red digital de servicios integrados.
  - letra: f
    texto:
      es: Se han determinado los elementos que constituyen los sistemas de interfonía y videoportería.
  - letra: g
    texto:
      es: Se han localizado sobre planos o esquemas los elementos de la red.
- 'n': 4
  texto:
    es: Configura infraestructuras de telecomunicaciones para el acceso al servicio de telefonía disponible al público, realizando cálculos y elaborando esquemas.
  criterios:
  - letra: a
    texto:
      es: Se han identificado los usos del inmueble (viviendas, locales comerciales y oficinas en edificios de viviendas, entre otros).
  - letra: b
    texto:
      es: Se han evaluado las necesidades telefónicas de los usuarios del inmueble.
  - letra: c
    texto:
      es: Se han determinado el número de líneas, atendiendo al uso, número de puestos de trabajo, superficie y tipos de acceso.
  - letra: d

      es: Se ha tenido en cuenta en la red común el cableado para el servicio a través de redes digitales.
  - letra: e
    texto:
      es: Se ha dimensionado la red de distribución, teniendo en cuenta la necesidad futura estimada y el número de verticales.
  - letra: f
    texto:
      es: Se han dimensionado las redes de dispersión e interior de usuario, (número de estancias, superficies, entre otros).
  - letra: g

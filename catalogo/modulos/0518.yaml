ra:
- 'n': 1
  texto:
    es: Replantea instalaciones y redes eléctricas, interpretando planos de obra civil, esquemas eléctricos y relacionando trazados, equipos y elementos con su lugar de ubicación.
  criterios:
  - letra: a
    texto:
      es: Se han identificado las características de diferentes tipos de locales.
  - letra: b
    texto:
      es: Se han identificado las características de las redes eléctricas de distribución.
  - letra: c
    texto:
      es: Se han identificado los diferentes tipos de suministros eléctricos.
  - letra: d
    texto:
      es: Se ha verificado la coincidencia entre los datos de los planos y la ubicación de las instalaciones.
  - letra: e
    texto:
      es: Se ha identificado el trazado de la instalación en obra.
  - letra: f
    texto:
      es: Se han relacionado los espacios y elementos de la instalación con su lugar de ubicación.
  - letra: g
    texto:
      es: Se ha comprobado que el trazado de la instalación no interfiere con otras existentes o previstas.
  - letra: h
    texto:
      es: Se han identificado posibles contingencias y se han planteado soluciones.
  - letra: i
    texto:
      es: Se han elaborado croquis con propuestas de soluciones a las contingencias.
  - letra: j
    texto:
      es: Se han aplicado las normas reglamentarias en el replanteo.
  - letra: k
    texto:
      es: Se han aplicado técnicas específicas de marcado y de replanteo de instalaciones.
- 'n': 2
  texto:
    es: Elabora programas de montaje de las instalaciones eléctricas, estableciendo la secuencia de actividades e identificando los recursos que se han de emplear.
  criterios:
  - letra: a
    texto:
      es: Se ha reconocido la documentación de montaje.
  - letra: b
    texto:
      es: Se han identificado las fases del plan de montaje.
  - letra: c
    texto:
      es: Se han asignado recursos a cada fase de montaje.
  - letra: d
    texto:
      es: Se ha comprobado la idoneidad de equipos, máquinas, herramientas, equipos de protección y medios auxiliares.
  - letra: e
    texto:
      es: Se han tenido en cuenta las medidas de seguridad requeridas en cada fase.
  - letra: f
    texto:
      es: Se han programado las actividades para cada fase del montaje.
  - letra: g
    texto:
      es: Se han planificado las intervenciones para el montaje con las condiciones de calidad y seguridad establecidas.
  - letra: h
    texto:
      es: Se han programado las actividades evitando interferencias.
  - letra: i
    texto:
      es: Se han determinado pruebas de puesta en servicio y seguridad eléctrica.
- 'n': 3
  texto:
    es: Monta instalaciones eléctricas en edificios y en el entorno de edificios, aplicando técnicas y procedimientos específicos y respetando las normas de seguridad.
  criterios:
  - letra: a
    texto:
      es: Se han identificado en los esquemas o planos las partes de la instalación.
  - letra: b
    texto:
      es: Se han seleccionado los elementos de cada instalación para su montaje.
  - letra: c
    texto:
      es: Se han conformado o mecanizado cajas, canalizaciones, conductores.
  - letra: d
    texto:
      es: Se han montado las canalizaciones adecuadas en cada caso.
  - letra: e
    texto:
      es: Se han tendido conductores, marcándolos y evitando cruzamientos.
  - letra: f
    texto:
      es: Se han fijado los mecanismos de las instalaciones.
  - letra: g
    texto:
      es: Se ha conexionado los conductores y/o mecanismos.
  - letra: h
    texto:
      es: Se han realizado pruebas y medidas reglamentarias.
  - letra: i
    texto:
      es: Se han utilizado las máquinas y herramientas adecuadas para cada instalación.
  - letra: j
    texto:
      es: Se han aplicado criterios de calidad en las intervenciones.
- 'n': 4
  texto:
    es: Aplica técnicas de montaje y conexionado de elementos de redes de distribución en baja tensión e instalaciones de alumbrado exterior analizando programas de montaje y describiendo las operaciones.
  criterios:
  - letra: a
    texto:
      es: Se ha relacionado las fases de montaje con el plan de calidad y el plan de montaje.
  - letra: b
    texto:
      es: Se han identificado las técnicas de trazado y de marcado de redes de distribución.
  - letra: c
    texto:
      es: Se han montado y conexionado elementos de las redes distribución.
  - letra: d
    texto:
      es: Se han montado y conexionado elementos de instalaciones de alumbrado exterior.
  - letra: e
    texto:
      es: Se ha seleccionado la maquinaría específica a cada fase del montaje.
  - letra: f
    texto:
      es: Se han documentado las posibles contingencias del montaje.
  - letra: g
    texto:
      es: Se han relacionado los elementos y equipos con sus características específicas de montaje.
  - letra: h
    texto:
      es: Se han identificado los medios técnicos para el montaje de redes de distribución y alumbrado exterior.
- 'n': 5
  texto:
    es: Verifica el funcionamiento de las instalaciones, efectuando pruebas y medidas y comprobando que los parámetros de la instalación responden a la normativa.
  criterios:
  - letra: a
    texto:
      es: Se ha verificado la adecuación de las instalaciones eléctricas de edificios a las instrucciones del REBT.
  - letra: b
    texto:
      es: Se han realizado medidas reglamentarias en los circuitos eléctricos de las instalaciones de interior.
  - letra: c
    texto:
      es: Se han realizado pruebas de funcionamiento.
  - letra: d
    texto:
      es: Se han comprobado los valores de aislamiento de las instalaciones.
  - letra: e
    texto:
      es: Se han comprobado los valores de rigidez dieléctrica de la instalación.
  - letra: f
    texto:
      es: Se ha verificado la resistencia de la toma de tierra y la corriente de fuga de la instalación.
  - letra: g
    texto:
      es: Se han registrado los valores de los parámetros característicos.
  - letra: h
    texto:
      es: Se ha verificado la sensibilidad de disparo de los interruptores diferenciales y protecciones.
  - letra: i
    texto:
      es: Se ha realizado un análisis de la red para detectar armónicos y perturbaciones.
  - letra: j
    texto:
      es: Se han realizado verificaciones típicas en locales especiales según REBT.
- 'n': 6
  texto:
    es: Diagnostica averías o disfunciones en las instalaciones eléctricas, determinando las causas que las producen y proponiendo soluciones.
  criterios:
  - letra: a
    texto:
      es: Se han definido y aplicado procedimientos de intervención en la diagnosis de averías y disfunciones.
  - letra: b
    texto:
      es: Se han seleccionado equipos de medida y verificación.
  - letra: c
    texto:
      es: Se han identificado los posibles circuitos afectados.
  - letra: d
    texto:
      es: Se ha tenido en cuenta el histórico de averías.
  - letra: e
    texto:
      es: Se han verificado los síntomas de las averías a través de las medidas realizadas y la observación del comportamiento de las instalaciones.
  - letra: f
    texto:
      es: Se ha determinado el alcance de la avería.
  - letra: g
    texto:
      es: Se han propuesto hipótesis de las causas y repercusión de averías.
  - letra: h
    texto:
      es: Se ha localizado el origen de la avería.
  - letra: i
    texto:
      es: Se han propuesto soluciones para la resolución de la avería o disfunción.
  - letra: j
    texto:
      es: Se han elaborado documentos de registro de averías.
- 'n': 7
  texto:
    es: Repara averías en instalaciones eléctricas, aplicando técnicas y procedimientos específicos y comprobando la restitución del funcionamiento.
  criterios:
  - letra: a
    texto:
      es: Se han planificado las intervenciones de reparación.
  - letra: b
    texto:
      es: Se han relacionado en los esquemas eléctricos de la instalación con los elementos que se deben sustituir.
  - letra: c
    texto:
      es: Se han seleccionado las herramientas o útiles necesarios.
  - letra: d
    texto:
      es: Se han sustituido los mecanismos, equipos, conductores, entre otros, responsables de la avería.
  - letra: e
    texto:
      es: Se ha comprobado la compatibilidad de los elementos que se deben sustituir.
  - letra: f
    texto:
      es: Se han realizado ajustes de los equipos y elementos intervenidos.
  - letra: g
    texto:
      es: Se ha verificado la funcionalidad de la instalación después de la intervención.
  - letra: h
    texto:
      es: Se ha actualizado el histórico de averías.
- 'n': 8
  texto:
    es: Realiza el mantenimiento preventivo de las instalaciones eléctricas analizando planes de mantenimiento y la normativa relacionada.
  criterios:
  - letra: a
    texto:
      es: Se ha reconocido la normativa de aplicación.
  - letra: b
    texto:
      es: Se han planificado las intervenciones del mantenimiento.
  - letra: c
    texto:
      es: Se han definido las operaciones de mantenimiento preventivo de las instalaciones.
  - letra: d
    texto:
      es: Se han medido parámetros en puntos críticos de la instalación.
  - letra: e
    texto:
      es: Se han realizado operaciones de mantenimiento preventivo.
  - letra: f
    texto:
      es: Se han elaborado los informes de contingencia e históricos.
- 'n': 9
  texto:
    es: Cumple las normas de prevención de riesgos laborales y de protección ambiental, identificando los riesgos asociados, las medidas y equipos para prevenirlos.
  criterios:
  - letra: a
    texto:
      es: Se han identificado los riesgos y el nivel de peligrosidad que supone la manipulación de los materiales, herramientas, útiles, máquinas y medios de transporte.
  - letra: b
    texto:
      es: Se ha operado con máquinas y herramientas respetando las normas de seguridad.
  - letra: c
    texto:
      es: Se han identificado las causas más frecuentes de accidentes en la manipulación de materiales, herramientas, máquinas de corte y conformado, entre otras.
  - letra: d
    texto:
      es: Se han reconocido los elementos de seguridad (protecciones, alarmas, pasos de emergencia, entre otros), los equipos de protección individual y colectiva (calzado, protección ocular, indumentaria, entre otros) que se deben emplear en las distintas operaciones de montaje y mantenimiento.
  - letra: e
    texto:
      es: Se ha identificado el uso correcto de los elementos de seguridad y de los equipos de protección individual y colectiva.
  - letra: f
    texto:
      es: Se ha relacionado la manipulación de materiales, herramientas y máquinas con las medidas de seguridad y protección personal requeridos.
  - letra: g
    texto:
      es: Se han identificado las posibles fuentes de contaminación del entorno ambiental.
  - letra: h
    texto:
      es: Se han clasificado los residuos generados para su retirada selectiva.
  - letra: i
    texto:
      es: Se ha valorado el orden y la limpieza de instalaciones y equipos como primer factor de prevención de riesgos.
contenidos:
- titulo:
    es: Replanteo de instalaciones eléctricas y redes eléctricas
  puntos:
  - es: Técnicas de marcado y replanteo.
  - es: Replanteo de instalaciones de edificios destinados principalmente a viviendas.
  - es: Replanteo de instalaciones en locales de pública concurrencia. Instalaciones en locales destinados a industrias.
  - es: Replanteo de instalaciones en locales de características especiales.
  - es: Replanteo de redes eléctricas de distribución en baja tensión.
- titulo:
    es: Elaboración de procesos del montaje de instalaciones eléctricas
  puntos:
  - es: El plan de montaje de las instalaciones eléctricas.
  - es: Acopio de materiales y elementos para el montaje de instalaciones.
  - es: Procedimientos de control de avances del montaje y calidad a obtener.
  - es: Seguridad aplicada al montaje de elementos y sistemas de instalaciones eléctricas.
  - es: Tiempos necesarios por unidad de obra.
  - es: Planificación de pruebas de seguridad y puesta en servicio.
  - es: 'Supervisión del montaje de instalaciones eléctricas en edificios: O procesos de montaje. Replanteo de la obra, mediciones y cantidades. O provisión de equipos, máquinas y herramientas. O rendimientos de tiempos necesarios por unidad de obra. O plan de calidad. Aseguramiento de la calidad.'
- titulo:
    es: Montaje de las instalaciones eléctricas de interior
  puntos:
  - es: Esquemas de instalaciones eléctricas de interior. Interpretación, tipología y características.
  - es: Procedimiento de montaje en instalaciones eléctricas de interior.
  - es: Montaje y conexionado de las instalaciones de enlace. Técnicas de montaje de la instalación de alumbrado de escalera y alumbrado general del edificio.
  - es: Técnicas de montaje de mecanismos de instalaciones eléctricas en viviendas.
  - es: Precauciones en el montaje de los elementos de protección en viviendas y locales.
  - es: Instalación de circuitos y características. Montaje de instalaciones eléctricas en locales de pública concurrencia.
  - es: Instalaciones de alumbrado de seguridad (de evacuación, ambiente o antipánico y zonas de alto riesgo). Alumbrado de emplazamiento.
  - es: Aplicación del Reglamento electrotécnico de baja tensión, de las normas particulares de las compañías suministradoras y las normas UNE en instalaciones eléctricas en edificios.
- titulo:
    es: Técnicas de montaje de redes eléctricas y alumbrado exterior
  puntos:
  - es: Procedimientos y fases de montaje específicos de las redes de distribución. Procedimientos y fases específicos de las instalaciones de alumbrado exterior.
  - es: Técnicas de montaje y conexionado de elementos de las redes de distribución de energía.
  - es: Técnicas de montaje y conexionado específicos de las instalaciones de alumbrado exterior. Montaje de báculos y soportes. Montaje de luminarias.
  - es: Maquinaria empleada en el montaje de canalizaciones. Maquinaria y herramienta utilizada en el conexionado de conductores.
  - es: Herramientas en el montaje de luminarias y equipos de iluminación.
- titulo:
    es: Verificaciones de instalaciones de edificios destinados a viviendas, locales de pública concurrencia o industriales
  puntos:
  - es: Técnicas y procedimientos para la puesta en servicio de instalaciones eléctricas.
  - es: Verificaciones y puntos de control de las instalaciones eléctricas en edificios y locales. Puntos de control y verificación en instalaciones con riesgo a incendio o especiales. Verificación y puntos de control de redes de distribución. Verificación y puntos de control de instalaciones de alumbrado exterior.
  - es: Medidas específicas para la verificación y la puesta en servicio de instalaciones eléctricas. Medidas de tensión, intensidad y continuidad.
  - es: Medidas de potencias eléctricas y factor de potencia. Medidas de rigidez dieléctrica. Medidas de resistividad del terreno y resistencia de puesta a tierra. Medidas de sensibilidad de aparatos de corte y protección. Medidas de aislamiento. Medidas con analizador de redes.
  - es: Utilización de aparatos de medida.
  - es: Comprobación de protecciones y puesta a tierra.
- titulo:
    es: Diagnosis de averías en instalaciones eléctricas
  puntos:
  - es: Diagnóstico de averías. Técnicas y equipos de detección. Averías tipo en las instalaciones eléctricas de edificios.
  - es: Elementos y sistemas susceptibles de producir averías en las instalaciones eléctricas.
  - es: Disfunciones y elementos distorsionadores en las instalaciones eléctricas.
  - es: Técnicas para la detección de averías producidas por el parasitaje y el ruido eléctrico.
  - es: Mediciones específicas de control de de disfunciones y averías.
  - es: Control de histórico de averías.
- titulo:
    es: Reparación de averías de elementos y sistemas utilizados en las instalaciones eléctricas
  puntos:
  - es: Planificación del proceso de reparación y sustitución de elementos y sistemas.
  - es: Causas y disfunciones producidas en las instalaciones eléctricas.
  - es: Herramientas de control o informáticas para la reparación y sustitución de elementos.
  - es: Compatibilidad de elementos. Reconocimiento de características de elementos.
  - es: Técnicas de ajustes de receptores y sistemas. Valores de tensión, resistencia e intensidad, entre otros.
- titulo:
    es: Mantenimiento en las instalaciones eléctricas en edificios
  puntos:
  - es: Mantenimiento de instalaciones eléctricas.
  - es: Mantenimiento preventivo. Mantenimiento predictivo. Mantenimiento correctivo.
  - es: Seguridad en el mantenimiento de instalaciones eléctricas.
  - es: Previsión de averías, inspecciones y revisiones periódicas.
  - es: Planificación del mantenimiento de las instalaciones eléctricas.
  - es: Equipos destinados al mantenimiento. Aparatos de medida usados en el mantenimiento de instalaciones eléctricas de edificios.
- titulo:
    es: Prevención de riesgos, seguridad y protección medioambiental
  puntos:
  - es: Normativa de prevención de riesgos laborales relativa al mantenimiento de instalaciones eléctricas en edificios.
  - es: Prevención de riesgos laborales en los procesos de montaje y mantenimiento.
  - es: Equipos de protección individual. (Características y criterios de utilización). Protección colectiva. Medios y equipos de protección.
  - es: Normativa reguladora en gestión de residuos.
  - es: Normativa de prevención de riesgos laborales.
  - es: Normativa de protección ambiental.

  - letra: e
    texto:
      es: Se ha identificado el uso correcto de los elementos de seguridad y de los equipos de protección individual y colectiva.
  - letra: f
    texto:
      es: Se ha relacionado la manipulación de materiales, herramientas y máquinas con las medidas de seguridad y protección personal requeridos.
  - letra: g
    texto:
      es: Se han determinado las medidas de seguridad y de protección personal que se deben adoptar en la preparación y ejecución de las operaciones de montaje y mantenimiento de sistemas inteligentes.
  - letra: h

- 'n': 1
  texto:
    es: Caracteriza las infraestructuras del hogar digital (IHD), examinando los ámbitos que lo componen y distinguiendo los servicios que hay que prestar.
  criterios:
  - letra: a
    texto:
      es: Se ha determinado el nivel de aplicación digital (ICT, nivel básico o nivel superior) y los servicios asociados.
  - letra: b
    texto:
      es: Se han definido las estructuras de las redes interiores, (HAN, TGCS, entre otras), las conexiones y canalizaciones de ampliación.
  - letra: c
    texto:
      es: Se han determinado las características y funcionalidades de los servicios.
  - letra: d
    texto:
      es: Se han determinado los buses de interconexión de los dispositivos y elementos.
  - letra: e
    texto:
      es: Se han definido los medios de acceso remoto a los servicios.
  - letra: f
    texto:
      es: Se han seleccionado los interfaces, servidores y pasarelas.
  - letra: g
    texto:
      es: Se ha aplicado la normativa vigente.

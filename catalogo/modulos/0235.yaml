  - es: Instalaciones comunes en viviendas y edificios.
  - es: Conductores eléctricos. Medidas fundamentales en viviendas. Reglamento electrotécnico de baja tensión aplicado a las instalaciones interiores. Convencionalismos de representación. Simbología normalizada en las instalaciones eléctricas. Interpretación de esquemas eléctricos de las instalaciones de vivienda, locales de pública concurrencia y locales industriales.
- titulo:

      es: Se han reparado o en su caso sustituido los componentes causantes de la avería.
  - letra: c
    texto:
      es: Se ha verificado la compatibilidad del nuevo elemento instalado.
  - letra: d
    texto:
      es: Se han restablecido las condiciones de normal funcionamiento del equipo o de la instalación.
  - letra: e
    texto:
      es: Se han realizado las intervenciones de mantenimiento con la calidad requerida.
  - letra: f
    texto:
      es: Se ha operado con autonomía en las actividades propuestas.
  - letra: g
    texto:
      es: Se ha elaborado un informe-memoria de las actividades desarrolladas, los procedimientos utilizados y los resultados obtenidos.
- 'n': 7
  texto:
    es: Cumple las normas de prevención de riesgos laborales y de protección ambiental, identificando los riesgos asociados y las medidas y equipos para prevenirlos.
  criterios:
  - letra: a
    texto:
      es: Se han identificado los riesgos y el nivel de peligrosidad que suponen la manipulación de los materiales, herramientas, útiles, máquinas y medios de transporte.
  - letra: b
    texto:
      es: Se han operado las máquinas respetando las normas de seguridad.
  - letra: c
    texto:
      es: Se han identificado las causas más frecuentes de accidentes en la manipulación de materiales, herramientas, máquinas de corte y conformado, entre otros.
  - letra: d
    texto:
      es: Se han descrito los elementos de seguridad (protecciones, alarmas, pasos de emergencia, entre otros) de las máquinas y de los equipos de protección individual (calzado, protección ocular, indumentaria, entre otros) que se deben emplear en las distintas operaciones de mecanizado y montaje.
  - letra: e
    texto:
      es: Se ha relacionado la manipulación de materiales, herramientas y máquinas con las medidas de seguridad y protección personal requeridas.
  - letra: f
    texto:
      es: Se han determinado las medidas de seguridad y de protección personal que se deben adoptar en la preparación y ejecución de las operaciones de montaje y mantenimiento de las instalaciones de infraestructuras comunes de telecomunicaciones en viviendas y edificios.
  - letra: g
    texto:
      es: Se han identificado las posibles fuentes de contaminación acústica, visual, entre otras, del entorno ambiental.
  - letra: h
    texto:
      es: Se han clasificado los residuos generados para su retirada selectiva.
  - letra: i

      es: Se han planteado hipótesis de las posibles causas de la avería y su repercusión en la instalación.
  - letra: e
    texto:
      es: Se ha localizado el subsistema, equipo o elemento responsable de la disfunción.
  - letra: f
    texto:
      es: Se ha operado con autonomía en las actividades propuestas.
- 'n': 6
  texto:
    es: Repara instalaciones de infraestructuras de telecomunicaciones, aplicando técnicas de corrección de disfunciones y en su caso de sustitución de componentes teniendo en cuenta las recomendaciones de los fabricantes.
  criterios:

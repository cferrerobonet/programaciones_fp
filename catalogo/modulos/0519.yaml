      es: Se ha simulado el proceso de tramitación administrativa previo a la puesta en servicio.
  - letra: g
    texto:
      es: Se han identificado los datos requeridos por el modelo oficial de certificado de instalación.
  - letra: h
    texto:
      es: Se ha distinguido la normativa de aplicación.
- 'n': 2

ra:
- 'n': 1
  texto:
    es: Identifica la documentación técnico-administrativa de las instalaciones, analizando proyectos e interpretando la información de cada documento.
  criterios:
  - letra: a
    texto:
      es: Se han reconocido los documentos que componen un proyecto.
  - letra: b
    texto:
      es: Se ha identificado la función de cada documento.
  - letra: c
    texto:
      es: Se ha relacionado el proyecto de la instalación con el proyecto general.
  - letra: d
    texto:
      es: Se han determinado los informes necesarios para la elaboración de cada documento.
  - letra: e
    texto:
      es: Se han reconocido las gestiones de tramitación legal de un proyecto.
  - letra: f
    texto:
      es: Se han identificado los datos requeridos por el modelo oficial de certificado de instalación.
  - letra: g
    texto:
      es: Se ha identificado la normativa de aplicación.
- 'n': 2
  texto:
    es: Elabora planos y esquemas de instalaciones de telecomunicaciones, dando respuesta a la configuración de las instalaciones y manejando programas informáticos de aplicación.
  criterios:
  - letra: a
    texto:
      es: Se han relacionado los elementos y espacios con la configuración de la instalación.
  - letra: b
    texto:
      es: Se han identificado los planos y esquemas indicados por la normativa.
  - letra: c
    texto:
      es: Se ha seleccionado la escala y el formato apropiado, de acuerdo con la utilizada en los planos de edificación.
  - letra: d
    texto:
      es: Se han tenido en cuenta las escalas mínimas para los planos de planta y para los planos generales de situación.
  - letra: e
    texto:
      es: Se han dibujado los esquemas (general, de principio y detalles, entre otros) de la infraestructura.
  - letra: f
    texto:
      es: Se han dibujado planos de la instalación.
  - letra: g
    texto:
      es: Se ha incluido en el cajetín la información indicada en la norma.
  - letra: h
    texto:
      es: Se han incorporado las leyendas cuando corresponda.
- 'n': 3
  texto:
    es: Elabora presupuestos de instalaciones de telecomunicaciones, considerando listado de materiales, baremos y aplicando precios unitarios.
  criterios:
  - letra: a
    texto:
      es: Se han identificado las unidades de obra de las instalaciones o sistemas y los elementos que las componen.
  - letra: b

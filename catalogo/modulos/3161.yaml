contenidos:
- titulo:
    es: Ciencias Sociales
  puntos:
  - es: 'Objetivos y estrategias de las Ciencias Sociales: procedimientos, términos y conceptos.'
  - es: Fuentes históricas y arqueológicas del conocimiento histórico. Riesgos del uso de las tecnologías de la información y de la comunicación. Uso ético de la información. El problema de la desinformación.
  - es: Las grandes migraciones humanas y el nacimiento de las primeras culturas.
  - es: 'Las raíces clásicas del mundo occidental: las instituciones, el pensamiento y el arte greco-latino.'
  - es: 'Principales hitos de la historia mundial, europea y nacional: causas y consecuencias sociales, políticas, económicas y culturales.'
  - es: Las relaciones internacionales y el estudio de conflictos y violencias. El Holocausto.
  - es: 'La ciudad y el mundo rural a lo largo de la historia: polis, urbes, ciudades, villas y aldeas.'
  - es: 'Organización social y política a lo largo de la historia: la transformación política del ser humano (desde la servidumbre a la ciudadanía). La ley como contrato social.'
  - es: Las formaciones identitarias (ideologías, nacionalismos y movimientos supranacionales).
  - es: La huella humana y la conservación, protección y defensa del patrimonio histórico-artístico, cultural y natural. Significado y función de las expresiones artísticas y culturales en las distintas civilizaciones. La relación del ser humano y la naturaleza a lo largo de la historia.
  - es: 'El proceso de construcción europea: integración económica, monetaria y ciudadana. Las instituciones europeas. Ciudadanía europea y global: ideas y actitudes para la formación de una identidad común.'
  - es: La contribución del Estado y sus instituciones a la paz, a la seguridad integral ciudadana y a la convivencia social.
  - es: España en Europa y el mundo. La seguridad y la cooperación internacional. Los compromisos internacionales de España. La resolución pacífica de los conflictos.
  - es: 'El sistema democrático: su construcción, sus principios básicos y distintos modelos. Instituciones y organizaciones democráticas. La Constitución española y el ordenamiento normativo autonómico, nacional y supranacional.'
  - es: 'Valores, derechos y deberes democráticos. La ciudadanía democrática: la participación, la responsabilidad ética y ecosocial, participación en proyectos comunitarios.'
  - es: 'La Declaración Universal de los Derechos Humanos: origen y justificación.'
  - es: El problema de la desigualdad. La solidaridad con colectivos en situaciones de pobreza, vulnerabilidad y exclusión social.
  - es: Diversidad social, multiculturalidad e interculturalidad. El respeto por las minorías etnoculturales. La crítica al eurocentrismo.
  - es: El logro de una efectiva igualdad de género. Manifestaciones y conductas no sexistas. El reconocimiento de los derechos LGTBQ+.
  - es: La emergencia climática y los problemas ecosociales. La conciencia ambiental. Compromiso y acción ante los Objetivos de Desarrollo Sostenible. Los efectos de la globalización en las sociedades actuales.
- titulo:
    es: Comunicación en lengua castellana
  puntos:
  - es: 1. Alfabetización mediática e informacional.
  - es: Estrategias de búsqueda y selección de información fiable, pertinente y de calidad.
  - es: Aspectos básicos de la propiedad intelectual.
  - es: Riesgos y consecuencias de la manipulación y la desinformación.
  - es: 'Estrategias de organización de la información: notas, esquemas, mapas conceptuales, resúmenes, etc.'
  - es: Tecnologías de la información. Dispositivos, aplicaciones informáticas y plataformas digitales de búsqueda de información.
  - es: 2. Comunicación.
  - es: 'Estrategias de producción, comprensión y análisis crítico de textos orales, escritos y multimodales de diferentes ámbitos con atención conjunta a los siguientes aspectos:'
  - es: 'Contexto: grado de formalidad de la situación; carácter público o privado; propósitos comunicativos e interpretación de intenciones; canal de comunicación y elementos no verbales de la comunicación.'
  - es: Secuencias textuales básicas, con especial atención a las expositivas y argumentativas.
  - es: Mecanismos de coherencia, cohesión y adecuación textual.
  - es: 'Géneros discursivos propios del ámbito personal: la conversación, con especial atención a los actos de habla que amenazan la imagen del interlocutor (la discrepancia, la queja, la orden, la reprobación).'
  - es: Géneros discursivos propios del ámbito social. Redes sociales y medios de comunicación. Etiqueta digital y riesgos de desinformación, manipulación y vulneración de la privacidad. Análisis de la imagen y de los elementos paratextuales de los textos icónico-verbales y multimodales.
  - es: 'Géneros discursivos propios del ámbito profesional: el currículum vitae, la carta de motivación y la entrevista de trabajo.'
  - es: Interacción oral y escrita de carácter informal y formal. Cooperación conversacional, cortesía lingüística y etiqueta digital. Escucha activa, asertividad y resolución dialogada de los conflictos. Estrategias discursivas y dialógicas para la expresión de ideas, la confrontación y el consenso.
  - es: 'Comprensión oral: sentido global del texto. Selección de la información relevante. La intención del emisor. Producción oral formal. Adecuación a la audiencia y al tiempo de exposición. Elementos no verbales. Rasgos discursivos y lingüísticos de la oralidad formal. La deliberación oral argumentada.'
  - es: 'Comprensión lectora: sentido global del texto. La intención del emisor.'
  - es: Producción escrita. Planificación, redacción, revisión y edición en diferentes soportes.
  - es: Corrección gramatical y ortográfica. Los signos de puntuación como mecanismo organizador del texto escrito. Su relación con el significado. Uso de diccionarios, manuales de consulta y correctores ortográficos en soporte digital.
  - es: 'Autoconfianza: puesta en valor de puntos fuertes. El error en la comunicación como oportunidad de mejora.'
  - es: 3. Educación literaria.
  - es: Lectura guiada de obras relevantes del patrimonio literario nacional y universal y de la literatura actual inscritas en un itinerario temático o de género.
  - es: Estrategias de construcción compartida de la interpretación de las obras. Discusiones o conversaciones literarias.
  - es: Construcción del sentido de la obra a partir del análisis de sus elementos formales y contextuales. Efectos de sus recursos expresivos en la recepción.
  - es: Estrategias de movilización de la experiencia personal, lectora y cultural para establecer vínculos de manera argumentada entre la obra leída y aspectos de la actualidad, así como con otros textos y manifestaciones artísticas.
  - es: Expresión, a través de modelos, de la experiencia lectora y de diferentes formas de apropiación y recreación de los textos leídos.
  - es: Lectura expresiva, dramatización y recitación de los textos atendiendo a los procesos de comprensión, apropiación y oralización implicados.
  - es: 4. Reflexión sobre la lengua.
  - es: Análisis de la diversidad lingüística del entorno. Biografía lingüística.
  - es: Reconocimiento de las lenguas de España y de las variedades dialectales del español. Las lenguas de signos. Exploración y cuestionamiento de prejuicios y estereotipos lingüísticos.
  - es: 'Aproximación a la lengua como sistema y a sus unidades básicas teniendo en cuenta los diferentes niveles: el sonido y sistema de escritura, las palabras (forma y significado) y su organización en el discurso (orden de las palabras y conexión entre los componentes oracionales).'
  - es: Procedimientos de adquisición y formación de palabras. Reflexión sobre los cambios en su significado, las relaciones semánticas entre palabras y sus valores denotativos y connotativos en función del contexto y el propósito comunicativo.
- titulo:
    es: Comunicación en lengua extranjera
  puntos:
  - es: Autoconfianza. El error como instrumento de mejora.
  - es: Estrategias básicas para la planificación, ejecución, control y reparación de la comprensión, la producción y la coproducción de textos orales, escritos y multimodales.
  - es: 'Funciones comunicativas básicas tanto del ámbito personal como del ámbito profesional de especialización: saludar, despedirse y presentarse; describir a personas, objetos y lugares; situar eventos en el tiempo; situar objetos, personas y lugares en el espacio; pedir e intercambiar información; dar instrucciones y órdenes; ofrecer, aceptar y rechazar ayuda, proposiciones o sugerencias; etc.'
  - es: Modelos contextuales y géneros discursivos comunes en la comprensión, producción y coproducción de textos orales, escritos y multimodales breves y sencillos tanto del ámbito personal como del ámbito profesional de especialización.
  - es: Unidades lingüísticas básicas y significados asociados a dichas unidades tales como la expresión de la entidad y sus propiedades; la cantidad y la cualidad; el espacio y las relaciones espaciales; el tiempo y las relaciones temporales; la afirmación; la negación; la interrogación y la exclamación; relaciones lógicas básicas.
  - es: Léxico, frases y expresiones de uso común en el ámbito personal y en el ámbito profesional de especialización.
  - es: Patrones sonoros, acentuales, rítmicos y de entonación básicos, y significados e intenciones comunicativas generales asociadas a dichos patrones.
  - es: Convenciones ortográficas básicas y significados e intenciones comunicativas asociados a los formatos, patrones y elementos gráficos.
  - es: Cortesía lingüística y etiqueta digital.
  - es: Herramientas analógicas y digitales básicas para la comprensión, producción y coproducción oral, escrita y multimodal; y plataformas virtuales de interacción y colaboración para el aprendizaje y la comunicación tanto en el ámbito personal como en el ámbito profesional de especialización.
  - es: Estrategias y técnicas para responder eficazmente a una necesidad comunicativa básica y concreta de forma comprensible, a pesar de las limitaciones derivadas del nivel de competencia en la lengua extranjera y en las demás lenguas del repertorio lingüístico propio.
  - es: Estrategias básicas para identificar, recuperar y utilizar unidades lingüísticas (léxico, morfosintaxis, patrones sonoros, etc.) a partir de la comparación de las lenguas y variedades que conforman el repertorio lingüístico personal.
  - es: Aspectos socioculturales y sociolingüísticos básicos relativos a la vida cotidiana y a las situaciones propias del ámbito profesional de especialización.
  - es: Estrategias básicas para entender y apreciar la diversidad lingüística y cultural.

      es: Se han montado las antenas.
  - letra: c
    texto:
      es: Se han realizado las conexiones entre antena y equipos.
  - letra: d
    texto:
      es: Se ha verificado la recepción de la señal.
  - letra: e
    texto:
      es: Se han instalado los dispositivos inalámbricos.
  - letra: f
    texto:
      es: Se han configurado los modos de funcionamiento.
  - letra: g
    texto:
      es: Se ha comprobado la conectividad entre diversos dispositivos y adaptadores inalámbricos.
  - letra: h
    texto:
      es: Se ha instalado el software correspondiente.
- 'n': 5
  texto:
    es: Reconoce los bloques funcionales de las centralitas telefónicas tipo PBX, relacionando las partes que las componen con su función en el conjunto.
  criterios:
  - letra: a
    texto:
      es: Se han clasificado las centralitas en función de la tecnología utilizada reconociendo las diferencias existentes entre ellas.
  - letra: b
    texto:
      es: Se han reconocido los servicios integrados (conexión con ordenadores, integración de voz y datos, entre otros).
  - letra: c

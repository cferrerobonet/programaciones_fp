ra:
- 'n': 1
  texto:
    es: Reconoce la configuración de una red de datos de un área local, identificando las características y función de los equipos y elementos que la componen.
  criterios:
  - letra: a
    texto:
      es: Se han identificado los distintos tipos de redes de datos.
  - letra: b
    texto:
      es: Se han descrito los principios de funcionamiento de las redes locales.
  - letra: c
    texto:
      es: Se han identificado las distintas topologías de las redes locales (anillo, estrella y bus, entre otros).
  - letra: d
    texto:
      es: Se han descrito los elementos de la red local y su función.
  - letra: e
    texto:
      es: Se han clasificado los medios de transmisión.
  - letra: f
    texto:
      es: Se han clasificado los equipos de distribución (switch y router entre otros).
  - letra: g
    texto:
      es: Se ha relacionado cada equipo de distribución con sus aplicaciones características.
- 'n': 2
  texto:
    es: Monta canalizaciones y cableado interpretando documentación técnica y aplicando técnicas de montaje.
  criterios:
  - letra: a
    texto:
      es: Se ha realizado un croquis de la instalación.
  - letra: b

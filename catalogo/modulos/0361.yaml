  - letra: f
    texto:
      es: Se ha conectado y configurado el servicio de VoIP a través de la central.
  - letra: g
    texto:
      es: Se ha verificado el funcionamiento del sistema.
  - letra: h
    texto:
      es: Se han aplicado las indicaciones del fabricante y la documentación técnica.
  - letra: i
    texto:
      es: Se ha realizado un informe de las actividades desarrolladas, incidencias y resultados obtenidos.
- 'n': 8
  texto:
    es: Mantiene y repara sistemas de telefonía y redes de datos relacionando las disfunciones con las causas que las producen.
  criterios:
  - letra: a
    texto:
      es: Se han identificado las disfunciones de la instalación mediante comprobación funcional.
  - letra: b

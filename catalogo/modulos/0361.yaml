ra:
- 'n': 1
  texto:
    es: Reconoce la configuración de una red de datos de un área local, identificando las características y función de los equipos y elementos que la componen.
  criterios:
  - letra: a
    texto:
      es: Se han identificado los distintos tipos de redes de datos.
  - letra: b
    texto:
      es: Se han descrito los principios de funcionamiento de las redes locales.
  - letra: c
    texto:
      es: Se han identificado las distintas topologías de las redes locales (anillo, estrella y bus, entre otros).
  - letra: d
    texto:
      es: Se han descrito los elementos de la red local y su función.
  - letra: e
    texto:
      es: Se han clasificado los medios de transmisión.
  - letra: f
    texto:
      es: Se han clasificado los equipos de distribución (switch y router entre otros).
  - letra: g
    texto:
      es: Se ha relacionado cada equipo de distribución con sus aplicaciones características.
- 'n': 2
  texto:
    es: Monta canalizaciones y cableado interpretando documentación técnica y aplicando técnicas de montaje.
  criterios:
  - letra: a
    texto:
      es: Se ha realizado un croquis de la instalación.
  - letra: b
    texto:
      es: Se han replanteado los espacios por los que pueden discurrir e instalarse los diferentes elementos que componen la instalación.
  - letra: c
    texto:
      es: Se han descrito las técnicas de montaje de cableado estructurado.
  - letra: d
    texto:
      es: Se han seleccionado los elementos y materiales necesarios para el montaje según la documentación técnica.
  - letra: e
    texto:
      es: Se han montado las canalizaciones y cajas repartidoras.
  - letra: f
    texto:
      es: Se ha tendido y etiquetado el cableado.
  - letra: g
    texto:
      es: Se han montado y etiquetado las tomas de usuario.
  - letra: h
    texto:
      es: Se han realizado las diferentes conexiones.
  - letra: i
    texto:
      es: Se han realizado las pruebas funcionales.
- 'n': 3
  texto:
    es: Instala infraestructuras de redes locales cableadas interpretando documentación técnica y aplicando técnicas de conexionado y montaje.
  criterios:
  - letra: a
    texto:
      es: Se ha optimizado el espacio disponible en la distribución de paneles y bandejas en los armarios.
  - letra: b
    texto:
      es: Se han preparado los distintos tipos de cables (par trenzado, fibra óptica, entre otros).
  - letra: c
    texto:
      es: Se han colocado los conectores correspondientes a cada tipo de cable.
  - letra: d
    texto:
      es: Se han realizado las conexiones de los paneles y de los equipos de conmutación.
  - letra: e
    texto:
      es: Se han etiquetado los cables y tomas de los paneles de conexión.
  - letra: f
    texto:
      es: Se ha realizado la conexión del armario a la red eléctrica.
  - letra: g
    texto:
      es: Se han interconectado los equipos informáticos en la red.
  - letra: h
    texto:
      es: Se ha instalado el software.
  - letra: i
    texto:
      es: Se han configurado los servicios de compartición.
- 'n': 4
  texto:
    es: Instala redes inalámbricas y VSAT, interpretando documentación técnica y aplicando técnicas de conexionado y montaje.
  criterios:
  - letra: a
    texto:
      es: Se ha identificado la ubicación de los puntos de acceso y antenas.
  - letra: b

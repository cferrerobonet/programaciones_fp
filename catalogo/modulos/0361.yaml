      es: Se han descrito las características generales y la función de los elementos que componen un sistema de telefonía (cableado, puntos de acceso de usuario, terminales, entre otros).
  - letra: c
    texto:
      es: Se han identificado las características de la instalación (capacidad, tipos de líneas, interfaces de entrada, entre otros).
  - letra: d
    texto:
      es: Se han utilizado programas informáticos de aplicación.
  - letra: e
    texto:
      es: Se han utilizado catálogos comerciales (en soporte informático y papel).
  - letra: f
    texto:
      es: Se han seleccionado los equipos y elementos según diferentes especificaciones.
  - letra: g
    texto:
      es: Se han identificado las líneas de enlace, las líneas de extensiones y las conexiones con los demás elementos asociados.
  - letra: h
    texto:
      es: Se ha realizado el esquema de la instalación.
  - letra: i

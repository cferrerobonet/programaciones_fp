      es: Se han replanteado los espacios por los que pueden discurrir e instalarse los diferentes elementos que componen la instalación.
  - letra: c
    texto:
      es: Se han descrito las técnicas de montaje de cableado estructurado.
  - letra: d
    texto:
      es: Se han seleccionado los elementos y materiales necesarios para el montaje según la documentación técnica.
  - letra: e
    texto:
      es: Se han montado las canalizaciones y cajas repartidoras.
  - letra: f
    texto:
      es: Se ha tendido y etiquetado el cableado.
  - letra: g
    texto:
      es: Se han montado y etiquetado las tomas de usuario.
  - letra: h
    texto:
      es: Se han realizado las diferentes conexiones.
  - letra: i
    texto:
      es: Se han realizado las pruebas funcionales.
- 'n': 3
  texto:
    es: Instala infraestructuras de redes locales cableadas interpretando documentación técnica y aplicando técnicas de conexionado y montaje.
  criterios:

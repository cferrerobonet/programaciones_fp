  - letra: c
    texto:
      es: Se han realizado verificaciones para la localización de la avería.
  - letra: d
    texto:
      es: Se ha identificado el tipo de avería y el coste de la reparación.
  - letra: e
    texto:
      es: Se ha subsanado la avería mediante la sustitución del módulo o equipo defectuoso.
  - letra: f
    texto:
      es: Se han realizado reparaciones en cables y canalizaciones.
  - letra: g
    texto:
      es: Se han realizado ampliaciones de las centrales de acuerdo a las especificaciones técnicas.
  - letra: h

ra:
- 'n': 1
  texto:
    es: Determina los elementos patrimoniales de la empresa, analizando la actividad empresarial.
  criterios:
  - letra: a
    texto:
      es: Se han identificado las fases del ciclo económico de la actividad empresarial.
  - letra: b
    texto:
      es: Se ha diferenciado entre inversión/financiación, inversión/gasto, gasto/pago e ingreso/cobro.
  - letra: c
    texto:
      es: Se han distinguido los distintos sectores económicos, basándose en la diversa tipología de actividades que se desarrollan en ellos.
  - letra: d
    texto:
      es: Se han definido los conceptos de patrimonio, elemento patrimonial y masa patrimonial.
  - letra: e
    texto:
      es: Se han identificado las masas patrimoniales que integran el activo, el pasivo exigible y el patrimonio neto.
  - letra: f
    texto:
      es: Se ha relacionado el patrimonio económico de la empresa con el patrimonio financiero y ambos con las fases del ciclo económico de la actividad empresarial.
  - letra: g
    texto:
      es: Se han clasificado un conjunto de elementos en masas patrimoniales.
- 'n': 2
  texto:
    es: Integra la normativa contable y el método de la partida doble, analizando el PGC PYME y la metodología contable.
  criterios:
  - letra: a
    texto:
      es: Se han distinguido las fases del ciclo contable completo, adaptándolas a la legislación española.
  - letra: b
    texto:
      es: Se ha definido el concepto de cuenta como instrumento para representar los distintos elementos patrimoniales y hechos económicos de la empresa.
  - letra: c
    texto:
      es: Se han determinado las características más importantes del método de contabilización por partida doble.
  - letra: d
    texto:
      es: Se han reconocido los criterios de cargo y abono como método de registro de las modificaciones del valor de los elementos patrimoniales.
  - letra: e
    texto:
      es: Se ha definido el concepto de resultado contable, diferenciando las cuentas de ingresos y gastos.
  - letra: f
    texto:
      es: Se ha reconocido el PGC como instrumento de armonización contable.
  - letra: g
    texto:
      es: Se han relacionado las distintas partes del PGC, diferenciando las obligatorias de las no obligatorias.
  - letra: h
    texto:
      es: Se ha codificado un conjunto de elementos patrimoniales de acuerdo con los criterios del PGC, identificando su función en la asociación y desglose de la información contable.
  - letra: i
    texto:
      es: Se han identificado las cuentas anuales que establece el PGC, determinando la función que cumplen.
- 'n': 3
  texto:
    es: Gestiona la información sobre tributos que afectan o gravan la actividad comercial de la empresa, seleccionando y aplicando la normativa mercantil y fiscal vigente.
  criterios:
  - letra: a
    texto:
      es: Se ha identificado la normativa fiscal básica.
  - letra: b
    texto:
      es: Se han clasificado los tributos, identificando las características básicas de los más significativos.
  - letra: c
    texto:
      es: Se han identificado los elementos tributarios.
  - letra: d
    texto:
      es: Se han identificado las características básicas de las normas mercantiles y fiscales aplicables a las operaciones de compraventa.
  - letra: e
    texto:
      es: Se han distinguido y reconocido las operaciones sujetas, exentas y no sujetas a IVA.
  - letra: f
    texto:
      es: Se han diferenciado los regímenes especiales del IVA.
  - letra: g
    texto:
      es: Se han determinado las obligaciones de registro en relación con el Impuesto del Valor Añadido, así como los libros registros (voluntarios y obligatorios) para las empresas.
  - letra: h
    texto:
      es: Se han calculado las cuotas liquidables del impuesto y elaborado la documentación correspondiente a su declaración-liquidación.
  - letra: i
    texto:
      es: Se ha reconocido la normativa sobre la conservación de documentos e información.
- 'n': 4
  texto:
    es: Elabora y organiza la documentación administrativa de las operaciones de compraventa, relacionándola con las transacciones comerciales de la empresa.
  criterios:
  - letra: a
    texto:
      es: Se han determinado los elementos del contrato mercantil de compraventa.
  - letra: b
    texto:
      es: Se han establecido los flujos de documentación administrativa relacionados con la compraventa.
  - letra: c
    texto:
      es: Se han identificado y cumplimentado los documentos relativos a la compraventa en la empresa, precisando los requisitos formales que deben reunir.
  - letra: d
    texto:
      es: Se han reconocido los procesos de expedición y entrega de mercancías, así como la documentación administrativa asociada.
  - letra: e
    texto:
      es: Se ha verificado que la documentación comercial, recibida y emitida, cumple la legislación vigente y los procedimientos internos de una empresa.
  - letra: f
    texto:
      es: Se han identificado los parámetros y la información que deben ser registrados en las operaciones de compraventa.
  - letra: g
    texto:
      es: Se ha valorado la necesidad de aplicar los sistemas de protección y salvaguarda de la información, así como criterios de calidad en el proceso administrativo.
  - letra: h
    texto:
      es: Se ha gestionado la documentación, manifestando rigor y precisión.
  - letra: i
    texto:
      es: Se han utilizado aplicaciones informáticas específicas.
- 'n': 5
  texto:
    es: Determina los trámites de la gestión de cobros y pagos, analizando la documentación asociada y su flujo dentro de la empresa.
  criterios:
  - letra: a
    texto:
      es: Se han diferenciado los flujos de entrada y salida de tesorería, valorando los procedimientos de autorización de los pagos y gestión de los cobros.
  - letra: b
    texto:
      es: Se han identificado los medios de pago y cobro habituales en la empresa, así como sus documentos justificativos, diferenciando pago al contado y pago aplazado.
  - letra: c
    texto:
      es: Se han comparado las formas de financiación comercial más habituales.
  - letra: d
    texto:
      es: Se han aplicado las leyes financieras de capitalización simple o compuesta en función del tipo de operaciones.
  - letra: e
    texto:
      es: Se ha calculado la liquidación de efectos comerciales en operaciones de descuento.
  - letra: f
    texto:
      es: Se han calculado las comisiones y gastos en determinados productos y servicios bancarios relacionados con el aplazamiento del pago o el descuento comercial.
- 'n': 6
  texto:
    es: Registra los hechos contables básicos derivados de la actividad comercial y dentro de un ciclo económico, aplicando la metodología contable y los principios y normas del PGC.
  criterios:
  - letra: a
    texto:
      es: Se han identificado y codificado las cuentas que intervienen en las operaciones relacionadas con la actividad comercial conforme al PGC.
  - letra: b
    texto:
      es: Se han aplicado criterios de cargo y abono según el PGC.
  - letra: c
    texto:
      es: Se han efectuado los asientos correspondientes a los hechos contables más habituales del proceso comercial.
  - letra: d
    texto:
      es: Se han contabilizado las operaciones relativas a la liquidación de IVA.
  - letra: e
    texto:
      es: Se han registrado los hechos contables previos al cierre del ejercicio económico.
  - letra: f
    texto:
      es: Se ha calculado el resultado contable y el balance de situación final.
  - letra: g
    texto:
      es: Se ha preparado la información económica relevante para elaborar la memoria para un ejercicio económico concreto.
  - letra: h
    texto:
      es: Se han utilizado aplicaciones informáticas específicas.
  - letra: i
    texto:
      es: Se han realizado las copias de seguridad según el protocolo establecido para salvaguardar los datos registrados.
  - letra: j
    texto:
      es: Se ha gestionado la documentación, manifestando rigor y precisión.
- 'n': 7
  texto:
    es: Efectúa la gestión y el control de la tesorería, utilizando aplicaciones informáticas.
  criterios:
  - letra: a
    texto:
      es: Se han establecido la función y los métodos de control de la tesorería en la empresa.
  - letra: b
    texto:
      es: Se han cumplimentado los distintos libros y registros de tesorería.
  - letra: c
    texto:
      es: Se han ejecutado las operaciones del proceso de arqueo y cuadre de la caja y se han detectado las desviaciones.
  - letra: d
    texto:
      es: Se ha cotejado la información de los extractos bancarios con el libro de registro del banco.
  - letra: e
    texto:
      es: Se han descrito las utilidades de un calendario de vencimientos en términos de previsión financiera.
  - letra: f
    texto:
      es: Se ha relacionado el servicio de tesorería y el resto de departamentos con empresas y entidades externas.
  - letra: g
    texto:
      es: Se ha valorado la utilización de medios on-line, administración electrónica y otros sustitutivos de la presentación física de los documentos.
  - letra: h
    texto:
      es: Se han efectuado los procedimientos de acuerdo con los principios de responsabilidad, seguridad y confidencialidad de la información.
  - letra: i
    texto:
      es: Se ha utilizado la hoja de cálculo y otras herramientas informáticas para la gestión de tesorería.
  - letra: j
    texto:
      es: Se ha identificado el procedimiento para gestionar la presentación de documentos de cobro y pago ante las administraciones públicas.

competencia_general:
  es: La competencia general de este título consiste en programar, organizar y evaluar las intervenciones de integración social aplicando estrategias y técnicas específicas, promoviendo la equidad, igualdad de oportunidades e inclusión, actuando en todo momento con una actitud de respeto hacia las personas destinatarias y garantizando la creación de entornos seguros tanto para las personas destinatarias como para el profesional con el fin de mejorar su situación personal, familiar y/o social.
competencias:
- letra: a
  texto:
    es: Elaborar proyectos de integración social, aplicando la normativa legal vigente e incorporando la perspectiva de género.
- letra: b
  texto:
    es: Dirigir la implementación de proyectos de integración social, coordinando las actuaciones necesarias para llevarlas a cabo y supervisando la realización de las actividades con criterios de calidad.
- letra: c
  texto:
    es: Realizar actuaciones administrativas asociadas al desarrollo del proyecto, aplicando las tecnologías de la información y la comunicación para gestionar la documentación generada.
- letra: d
  texto:
    es: Programar actividades de integración social, aplicando los recursos y estrategias metodológicas más adecuadas.
- letra: e
  texto:
    es: Diseñar y poner en práctica actuaciones para prevenir la violencia doméstica, evaluando el desarrollo de las mismas.
- letra: f
  texto:
    es: Diseñar actividades de atención a las necesidades físicas y psicosociales, en función de las características de los usuarios y del contexto, controlando y evaluando el desarrollo de las mismas.
- letra: g
  texto:
    es: Organizar las actividades de apoyo a la gestión doméstica, en función de las características de la unidad de convivencia, controlando y evaluando el desarrollo de las mismas.
- letra: h
  texto:
    es: Organizar y desarrollar actividades de apoyo psicosocial, mostrando una actitud respetuosa con la intimidad de las personas y evaluando el desarrollo de las mismas.
- letra: i
  texto:
    es: Organizar y desarrollar actividades de entrenamiento en habilidades de autonomía personal y social, evaluando los resultados conseguidos.
- letra: j
  texto:
    es: Diseñar y desarrollar actividades de intervención socioeducativa dirigidas al alumnado con necesidades educativas específicas, colaborando con el equipo interdisciplinar.
- letra: k
  texto:
    es: Organizar e implementar programas de inserción laboral y ocupacional, evaluando el desarrollo de los mismos y su ajuste al itinerario prefijado.
- letra: l
  texto:
    es: Entrenar en habilidades de comunicación, haciendo uso de sistemas alternativos o aumentativos y motivando a las personas usuarias en la utilización de los mismos.
- letra: m
  texto:
    es: Realizar tareas de mediación entre personas y grupos, aplicando técnicas participativas y de gestión de conflictos de forma eficiente.
- letra: 'n'
  texto:
    es: Aplicar protocolos establecidos en materia de primeros auxilios en situaciones de accidente o emergencia.
- letra: ñ
  texto:
    es: Realizar el control y seguimiento de la intervención con actitud autocrítica y aplicando criterios de calidad y procedimientos de retroalimentación para corregir las desviaciones detectadas.
- letra: o
  texto:
    es: Mantener relaciones fluidas con las personas usuarias y sus familias, miembros del grupo de trabajo y otros profesionales, mostrando habilidades sociales y aportando soluciones a los conflictos que surjan.
- letra: p
  texto:
    es: Adaptarse a las nuevas situaciones laborales, manteniendo actualizados los conocimientos científicos, técnicos y tecnológicos relativos a su entorno profesional, gestionando su formación y los recursos existentes en el aprendizaje a lo largo de la vida y utilizando las tecnologías de la información y la comunicación.
- letra: q
  texto:
    es: Resolver situaciones, problemas o contingencias con iniciativa y autonomía en el ámbito de su competencia, con creatividad, innovación y espíritu de mejora en el trabajo personal y en el de los miembros del equipo.
- letra: r
  texto:
    es: Organizar y coordinar equipos de trabajo con responsabilidad, supervisando el desarrollo del mismo, manteniendo relaciones fluidas y asumiendo el liderazgo, así como aportando soluciones a los conflictos grupales que se presenten.
- letra: s
  texto:
    es: Comunicarse con sus iguales, superiores, clientes y personas bajo su responsabilidad, utilizando vías eficaces de comunicación, transmitiendo la información o conocimientos adecuados y respetando la autonomía y competencia de las personas que intervienen en el ámbito de su trabajo.
- letra: t
  texto:
    es: Generar entornos seguros en el desarrollo de su trabajo y el de su equipo, supervisando y aplicando los procedimientos de prevención de riesgos laborales y ambientales, de acuerdo con lo establecido por la normativa y los objetivos de la empresa.
- letra: u
  texto:
    es: Supervisar y aplicar procedimientos de gestión de calidad, de accesibilidad universal y de «diseño para todos», en las actividades profesionales incluidas en los procesos de producción o prestación de servicios.
- letra: v
  texto:
    es: Realizar la gestión básica para la creación y funcionamiento de una pequeña empresa y tener iniciativa en su actividad profesional con sentido de la responsabilidad social.
- letra: w
  texto:
    es: Ejercer sus derechos y cumplir con las obligaciones derivadas de su actividad profesional, de acuerdo con lo establecido en la legislación vigente, participando activamente en la vida económica, social y cultural.

competencia_general:
  es: La competencia general de este título consiste en realizar operaciones de mantenimiento, montaje de accesorios y transformaciones en las áreas de mecánica, hidráulica, neumática y electricidad del sector de automoción, ajustándose a procedimientos y tiempos establecidos, cumpliendo con las especificaciones de calidad, seguridad y protección ambiental.
competencias:
- letra: a
  texto:
    es: Seleccionar los procesos de reparación interpretando la información técnica incluida en manuales y catálogos.
- letra: b
  texto:
    es: Localizar averías en los sistemas mecánicos, hidráulicos, neumáticos y eléctricos-electrónicos, del vehículo, utilizando los instrumentos y equipos de diagnóstico pertinentes.
- letra: c
  texto:
    es: Reparar el motor térmico y sus sistemas auxiliares utilizando las técnicas de reparación prescritas por los fabricantes.
- letra: d
  texto:
    es: Reparar conjuntos, subconjuntos y elementos de los sistemas eléctricos-electrónicos del vehículo, utilizando las técnicas de reparación prescritas por los fabricantes.
- letra: e
  texto:
    es: Sustituir y ajustar elementos de los sistemas de suspensión y dirección.
- letra: f
  texto:
    es: Reparar los sistemas de transmisión de fuerzas y frenado aplicando las técnicas de reparación prescritas por los fabricantes.
- letra: g
  texto:
    es: Verificar los resultados de sus intervenciones comparándolos con los estándares de calidad establecidos.
- letra: h
  texto:
    es: Aplicar procedimientos de prevención de riesgos laborales y de protección ambiental, de acuerdo con lo establecido por normativa.
- letra: i
  texto:
    es: Cumplir con los objetivos de la empresa, colaborando con el equipo de trabajo y actuando con los principios de responsabilidad y tolerancia.
- letra: j
  texto:
    es: Resolver problemas y tomar decisiones individuales siguiendo las normas y procedimientos establecidos, definidos dentro del ámbito de su competencia.
- letra: k
  texto:
    es: Adaptarse a diferentes puestos de trabajo y a las nuevas situaciones laborales originadas por cambios tecnológicos y organizativos en los procesos productivos.
- letra: l
  texto:
    es: Ejercer sus derechos y cumplir con las obligaciones derivadas de las relaciones laborales, de acuerdo con lo establecido en la legislación vigente.
- letra: m
  texto:
    es: Crear y gestionar una pequeña empresa, realizando un estudio de viabilidad de productos, de planificación de la producción y de comercialización.
- letra: 'n'
  texto:
    es: Gestionar su carrera profesional, analizando las oportunidades de empleo, autoempleo y de aprendizaje.
- letra: ñ
  texto:
    es: Participar de forma activa en la vida económica, social y cultural, con una actitud crítica y de responsabilidad.

competencia_general:
  es: La competencia general de este título consiste en desarrollar y gestionar proyectos de montaje y mantenimiento de instalaciones automáticas de medida, regulación y control de procesos en sistemas industriales, así como supervisar o ejecutar el montaje, mantenimiento y la puesta en marcha de dichos sistemas, respetando criterios de calidad, seguridad y respeto al medio ambiente y al diseño para todos.
competencias:
- letra: a
  texto:
    es: Definir los datos necesarios para el desarrollo de proyectos y memorias técnicas de sistemas automáticos.
- letra: b
  texto:
    es: Configurar instalaciones y sistemas automáticos, de acuerdo con las especificaciones y las prescripciones reglamentarias.
- letra: c
  texto:
    es: Seleccionar los equipos y los elementos de cableado e interconexión necesarios en la instalación automática, de acuerdo con las especificaciones y las prescripciones reglamentarias.
- letra: d
  texto:
    es: Elaborar los programas de control, de acuerdo con las especificaciones y las características funcionales de la instalación.
- letra: e
  texto:
    es: Configurar los equipos, desarrollando programas de gestión y control de redes de comunicación mediante buses estándar de sistemas de automatización industrial.
- letra: f
  texto:
    es: Elaborar planos y esquemas de instalaciones y sistemas automáticos, de acuerdo con las características de los equipos, las características funcionales de la instalación y utilizando herramientas informáticas de diseño asistido.
- letra: g
  texto:
    es: Elaborar presupuestos de instalaciones automáticas, optimizando los aspectos económicos en función de los requisitos técnicos del montaje y mantenimiento de equipos.
- letra: h
  texto:
    es: Definir el protocolo de montaje, las pruebas y las pautas para la puesta en marcha de instalaciones automáticas, a partir de las especificaciones.
- letra: i
  texto:
    es: Gestionar el suministro y almacenamiento de materiales y equipos, definiendo la logística y controlando las existencias.
- letra: j
  texto:
    es: Replantear la instalación de acuerdo con la documentación técnica, resolviendo los problemas de su competencia e informando de otras contingencias para asegurar la viabilidad del montaje.
- letra: k
  texto:
    es: Supervisar y/o montar los equipos y elementos asociados a las instalaciones eléctricas y electrónicas, de control e infraestructuras de comunicaciones en sistemas automáticos.
- letra: l
  texto:
    es: Supervisar y/o mantener instalaciones y equipos, realizando las operaciones de comprobación, localización de averías, ajuste y sustitución de sus elementos, y restituyendo su funcionamiento.
- letra: m
  texto:
    es: Supervisar y realizar la puesta en servicio de sistemas de automatización industrial, verificando el cumplimiento de las condiciones de funcionamiento establecidas.
- letra: 'n'
  texto:
    es: Elaborar documentación técnica y administrativa de acuerdo con la legislación vigente y con los requerimientos del cliente.
- letra: ñ
  texto:
    es: Adaptarse a las nuevas situaciones laborales, manteniendo actualizados los conocimientos científicos, técnicos y tecnológicos relativos a su entorno profesional, gestionando su formación y los recursos existentes en el aprendizaje a lo largo de la vida y utilizando las tecnologías de la información y la comunicación.
- letra: o
  texto:
    es: Resolver situaciones, problemas o contingencias con iniciativa y autonomía en el ámbito de su competencia, con creatividad, innovación y espíritu de mejora en el trabajo personal y en el de los miembros del equipo.
- letra: p
  texto:
    es: Organizar y coordinar equipos de trabajo con responsabilidad, supervisando el desarrollo del mismo, manteniendo relaciones fluidas y asumiendo el liderazgo, así como aportando soluciones a los conflictos grupales que se presenten.
- letra: q
  texto:
    es: Comunicarse con sus iguales, superiores, clientes y personas bajo su responsabilidad, utilizando vías eficaces de comunicación, transmitiendo la información o conocimientos adecuados y respetando la autonomía y competencia de las personas que intervienen en el ámbito de su trabajo.
- letra: r
  texto:
    es: Generar entornos seguros en el desarrollo de su trabajo y el de su equipo, supervisando y aplicando los procedimientos de prevención de riesgos laborales y ambientales, de acuerdo con lo establecido por la normativa y los objetivos de la empresa.
- letra: s
  texto:
    es: Supervisar y aplicar procedimientos de gestión de calidad, de accesibilidad universal y de «diseño para todos», en las actividades profesionales incluidas en los procesos de producción o prestación de servicios.
- letra: t
  texto:
    es: Realizar la gestión básica para la creación y funcionamiento de una pequeña empresa y tener iniciativa en su actividad profesional con sentido de la responsabilidad social.
- letra: u
  texto:
    es: Ejercer sus derechos y cumplir con las obligaciones derivadas de su actividad profesional, de acuerdo con lo establecido en la legislación vigente, participando activamente en la vida económica, social y cultural.

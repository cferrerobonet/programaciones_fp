competencia_general:
  es: La competencia general de este título consiste en organizar, programar y supervisar la ejecución de las operaciones de mantenimiento y su logística en el sector de automoción, diagnosticando averías en casos complejos, y garantizando el cumplimiento de las especificaciones establecidas por la normativa y por el fabricante del vehículo.
competencias:
- letra: a
  texto:
    es: Obtener un prediagnóstico de los problemas de funcionamiento de los vehículos para elaborar la orden de trabajo correspondiente.
- letra: b
  texto:
    es: Realizar el diagnóstico de averías de un vehículo, seleccionando y operando los medios y equipos necesarios y siguiendo un orden lógico de operaciones.
- letra: c
  texto:
    es: Realizar tasaciones y elaboración de presupuestos en el área de carrocería y electromecánica.
- letra: d
  texto:
    es: Planificar los procesos de mantenimiento en un taller de reparación de vehículos, haciendo que se cumplan los métodos y tiempos establecidos.
- letra: e
  texto:
    es: Gestionar el área de recambios de vehículos, teniendo en cuenta las existencias en función de las variables de compra y venta.
- letra: f
  texto:
    es: Definir las características que deben cumplir plantillas de trabajo y utillajes necesarios en operaciones de mantenimiento para proceder al diseño de los mismos.
- letra: g
  texto:
    es: Programar el mantenimiento de grandes flotas de vehículos para obtener la máxima operatividad de las mismas.
- letra: h
  texto:
    es: Organizar los programas de mantenimiento de las instalaciones y equipos que componen el taller de reparación de vehículos en el sector de automoción.
- letra: i
  texto:
    es: Administrar y gestionar un taller de mantenimiento de vehículos, conociendo y cumpliendo las obligaciones legales.
- letra: j
  texto:
    es: Gestionar la limpieza y el orden en el lugar de trabajo cumpliendo los requisitos de salud laboral y de impacto medioambiental.
- letra: k
  texto:
    es: Efectuar consultas, dirigiéndose a la persona adecuada y saber respetar la autonomía de los subordinados, informando cuando sea conveniente.
- letra: l
  texto:
    es: Mantener el espíritu de innovación y actualización en el ámbito de su trabajo para adaptarse a los cambios tecnológicos y organizativos de su entorno profesional.
- letra: m
  texto:
    es: Liderar situaciones colectivas que se puedan producir, mediando en conflictos personales y laborales, contribuyendo al establecimiento de un ambiente de trabajo agradable, actuando en todo momento de forma sincera, respetuosa y tolerante.
- letra: 'n'
  texto:
    es: Adaptarse a diferentes puestos de trabajo y nuevas situaciones laborales, originados por cambios tecnológicos y organizativos.
- letra: ñ
  texto:
    es: Resolver problemas y tomar decisiones individuales, siguiendo las normas y procedimientos establecidos, definidos dentro del ámbito de su competencia.
- letra: o
  texto:
    es: Ejercer sus derechos y cumplir con las obligaciones derivadas de las relaciones laborales, de acuerdo con lo establecido en la legislación vigente.
- letra: p
  texto:
    es: Gestionar su carrera profesional, analizando las oportunidades de empleo, autoempleo y de aprendizaje.
- letra: q
  texto:
    es: Participar de forma activa en la vida económica, social y cultural con actitud crítica y responsable.

competencia_general:
  es: La competencia general de este título consiste en montar y mantener infraestructuras de telecomunicación en edificios, instalaciones eléctricas de baja tensión, máquinas eléctricas y sistemas automatizados, aplicando normativa y reglamentación vigente, protocolos de calidad, seguridad y riesgos laborales, asegurando su funcionalidad y respeto al medio ambiente.
competencias:
- letra: a
  texto:
    es: Establecer la logística asociada al montaje y mantenimiento, interpretando la documentación técnica de las instalaciones y equipos.
- letra: b
  texto:
    es: Configurar y calcular instalaciones y equipos determinando el emplazamiento y dimensiones de los elementos que los constituyen, respetando las prescripciones reglamentarias.
- letra: c
  texto:
    es: Elaborar el presupuesto de montaje o mantenimiento de la instalación o equipo.
- letra: d
  texto:
    es: Acopiar los recursos y medios para acometer la ejecución del montaje o mantenimiento.
- letra: e
  texto:
    es: Replantear la instalación de acuerdo a la documentación técnica resolviendo los problemas de su competencia e informando de otras contingencias para asegurar la viabilidad del montaje.
- letra: f
  texto:
    es: Montar los elementos componentes de redes de distribución de baja tensión y elementos auxiliares en condiciones de calidad, seguridad y respeto al medio ambiente.
- letra: g
  texto:
    es: Montar los equipos y canalizaciones asociados a las instalaciones eléctricas y automatizadas, solares fotovoltaicas e infraestructuras de telecomunicaciones en edificios en condiciones de calidad, seguridad y respeto al medio ambiente.
- letra: h
  texto:
    es: Instalar y mantener máquinas eléctricas rotativas y estáticas en condiciones de calidad y seguridad.
- letra: i
  texto:
    es: Mantener y reparar instalaciones y equipos realizando las operaciones de comprobación, ajuste y sustitución de sus elementos, restituyendo su funcionamiento en condiciones de calidad, seguridad y respeto al medio ambiente.
- letra: j
  texto:
    es: Verificar el funcionamiento de la instalación o equipo mediante pruebas funcionales y de seguridad para proceder a su puesta en marcha o servicio.
- letra: k
  texto:
    es: Elaborar la documentación técnica y administrativa de acuerdo a la reglamentación y normativa vigente y a los requerimientos del cliente.
- letra: l
  texto:
    es: Aplicar los protocolos y normas de seguridad, de calidad y respeto al medio ambiente en las intervenciones realizadas en los procesos de montaje y mantenimiento de las instalaciones.
- letra: m
  texto:
    es: Integrarse en la organización de la empresa colaborando en la consecución de los objetivos y participando activamente en el grupo de trabajo con actitud respetuosa y tolerante.
- letra: 'n'
  texto:
    es: Cumplir con los objetivos de la producción, colaborando con el equipo de trabajo y actuando conforme a los principios de responsabilidad y tolerancia.
- letra: ñ
  texto:
    es: Adaptarse a diferentes puestos de trabajo y nuevas situaciones laborales, originados por cambios tecnológicos y organizativos en los procesos productivos.
- letra: o
  texto:
    es: Resolver problemas y tomar decisiones individuales siguiendo las normas y procedimientos establecidos, definidos dentro del ámbito de su competencia.
- letra: p
  texto:
    es: Ejercer sus derechos y cumplir con las obligaciones derivadas de las relaciones laborales, de acuerdo con lo establecido en la legislación vigente.
- letra: q
  texto:
    es: Gestionar su carrera profesional, analizando las oportunidades de empleo, autoempleo y de aprendizaje.
- letra: r
  texto:
    es: Crear y gestionar una pequeña empresa, realizando un estudio de viabilidad de productos, de planificación de la producción y de comercialización.
- letra: s
  texto:
    es: Participar de forma activa en la vida económica, social y cultural, con una actitud crítica y responsable.

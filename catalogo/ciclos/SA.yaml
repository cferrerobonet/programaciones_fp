competencia_general:
  es: La competencia general del título consiste en realizar tareas administrativas y de gestión básicas, con autonomía con responsabilidad e iniciativa personal, operando con la calidad indicada, observando las normas de aplicación vigente medioambientales y de seguridad e higiene en el trabajo y comunicándose de forma oral y escrita en lengua castellana y, en su caso, en la lengua cooficial propia así como en alguna lengua extranjera.
competencias:
- letra: a
  texto:
    es: Preparar equipos y aplicaciones informáticas para llevar a cabo la grabación, tratamiento e impresión de datos y textos, asegurando su funcionamiento.
- letra: b
  texto:
    es: Elaborar documentos mediante las utilidades básicas de las aplicaciones informáticas de los procesadores de texto y hojas de cálculo aplicando procedimientos de escritura al tacto con exactitud y rapidez.
- letra: c
  texto:
    es: Realizar tareas básicas de almacenamiento y archivo de información y documentación, tanto en soporte digital como convencional, de acuerdo con los protocolos establecidos.
- letra: d
  texto:
    es: Realizar labores de reprografía y encuadernado básico de documentos de acuerdo a los criterios de calidad establecidos.
- letra: e
  texto:
    es: Tramitar correspondencia y paquetería, interna o externa, utilizando los medios y criterios establecidos.
- letra: f
  texto:
    es: Realizar operaciones básicas de tesorería, utilizando los documentos adecuados en cada caso.
- letra: g
  texto:
    es: Recibir y realizar comunicaciones telefónicas e informática trasmitiendo con precisión la información encomendadas según los protocolos y la imagen corporativa.
- letra: h
  texto:
    es: Realizar las tareas básicas de mantenimiento del almacén de material de oficina, preparando los pedidos que aseguren un nivel de existencias mínimo.
- letra: i
  texto:
    es: Atender al cliente, utilizando las normas de cortesía y demostrando interés y preocupación por resolver satisfactoriamente sus necesidades.
- letra: j
  texto:
    es: Resolver problemas predecibles relacionados con su entorno físico, social, personal y productivo, utilizando el razonamiento científico y los elementos proporcionados por las ciencias aplicadas y sociales.
- letra: k
  texto:
    es: Actuar de forma saludable en distintos contextos cotidianos que favorezcan el desarrollo personal y social, analizando hábitos e influencias positivas para la salud humana.
- letra: l
  texto:
    es: Valorar actuaciones encaminadas a la conservación del medio ambiente diferenciando las consecuencias de las actividades cotidianas que pueda afectar al equilibrio del mismo.
- letra: m
  texto:
    es: Obtener y comunicar información destinada al autoaprendizaje y a su uso en distintos contextos de su entorno personal, social o profesional mediante recursos a su alcance y los propios de las tecnologías de la información y de la comunicación.
- letra: 'n'
  texto:
    es: Actuar con respeto y sensibilidad hacia la diversidad cultural, el patrimonio histórico-artístico y las manifestaciones culturales y artísticas, apreciando su uso y disfrute como fuente de enriquecimiento personal y social.
- letra: ñ
  texto:
    es: Comunicarse con claridad, precisión y fluidez en distintos contextos sociales o profesionales y por distintos medios, canales y soportes a su alcance, utilizando y adecuando recursos lingüísticos orales y escritos propios de la lengua castellana y, en su caso, de la lengua cooficial.
- letra: o
  texto:
    es: Comunicarse en situaciones habituales tanto laborales como personales y sociales utilizando recursos lingüísticos básicos en lengua extranjera.
- letra: p
  texto:
    es: Realizar explicaciones sencillas sobre acontecimientos y fenómenos característicos de las sociedades contemporáneas a partir de información histórica y geográfica a su disposición.
- letra: q
  texto:
    es: Adaptarse a las nuevas situaciones laborales originadas por cambios tecnológicos y organizativos en su actividad laboral, utilizando las ofertas formativas a su alcance y localizando los recursos mediante las tecnologías de la información y la comunicación.
- letra: r
  texto:
    es: Cumplir las tareas propias de su nivel con autonomía y responsabilidad, empleando criterios de calidad y eficiencia en el trabajo asignado y efectuándolo de forma individual o como miembro de un equipo.
- letra: s
  texto:
    es: Comunicarse eficazmente, respetando la autonomía y competencia de las distintas personas que intervienen en su ámbito de trabajo, contribuyendo a la calidad del trabajo realizado.
- letra: t
  texto:
    es: Asumir y cumplir las medidas de prevención de riesgos y seguridad laboral en la realización de las actividades laborales evitando daños personales, laborales y ambientales.
- letra: u
  texto:
    es: Cumplir las normas de calidad, de accesibilidad universal y diseño para todos que afectan a su actividad profesional.
- letra: v
  texto:
    es: Actuar con espíritu emprendedor, iniciativa personal y responsabilidad en la elección de los procedimientos de su actividad profesional.
- letra: w
  texto:
    es: Ejercer sus derechos y cumplir con las obligaciones derivadas de su actividad profesional, de acuerdo con lo establecido en la legislación vigente, participando activamente en la vida económica, social y cultural.

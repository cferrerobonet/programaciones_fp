competencia_general:
  es: La competencia general de este título consiste en desarrollar proyectos y en gestionar y supervisar el montaje y mantenimiento de instalaciones electrotécnicas en el ámbito del reglamento electrotécnico para baja tensión (REBT).También consiste en supervisar el mantenimiento de instalaciones de infraestructuras comunes de telecomunicaciones, a partir de la documentación técnica, especificaciones, normativa y procedimientos establecidos, asegurando el funcionamiento, la calidad, la seguridad, y la conservación del medio ambiente.
competencia_general_corregida:
  es: La competencia general de este título consiste en desarrollar proyectos y en gestionar y supervisar el montaje y mantenimiento de instalaciones electrotécnicas en el ámbito del reglamento electrotécnico para baja tensión (REBT). También consiste en supervisar el mantenimiento de instalaciones de infraestructuras comunes de telecomunicaciones, a partir de la documentación técnica, especificaciones, normativa y procedimientos establecidos, asegurando el funcionamiento, la calidad, la seguridad, y la conservación del medio ambiente.
competencia_general_correccion: 'Errata del BOE: falta el espacio tras el punto'
competencias:
- letra: a
  texto:
    es: Elaborar el informe de especificaciones de instalaciones/sistemas obteniendo los datos para la elaboración de proyectos o memorias técnicas.
- letra: b
  texto:
    es: Calcular las características técnicas de equipos y elementos y de las instalaciones, cumpliendo la normativa vigente y los requerimientos del cliente.
- letra: c
  texto:
    es: Elaborar el presupuesto de la instalación, cotejando los aspectos técnicos y económicos para dar la mejor respuesta al cliente.
- letra: d
  texto:
    es: Configurar instalaciones y sistemas de acuerdo con las especificaciones y las prescripciones reglamentarias.
- letra: e
  texto:
    es: Gestionar el suministro y almacenamiento de los materiales y equipos, definiendo la logística y controlando las existencias.
- letra: f
  texto:
    es: Planificar el montaje y pruebas de instalaciones y sistemas a partir de la documentación técnica o características de la obra.
- letra: g
  texto:
    es: Realizar el lanzamiento del montaje de las instalaciones partiendo del programa de montaje y del plan general de la obra.
- letra: h
  texto:
    es: Supervisar los procesos de montaje de las instalaciones, verificando su adecuación a las condiciones de obra y controlando su avance para cumplir con los objetivos de la empresa.
- letra: i
  texto:
    es: Planificar el mantenimiento a partir de la normativa, condiciones de la instalación y recomendaciones de los fabricantes.
- letra: j
  texto:
    es: Supervisar los procesos de mantenimiento de las instalaciones controlando los tiempos y la calidad de los resultados.
- letra: k
  texto:
    es: Poner en servicio las instalaciones, supervisando el cumplimiento de los requerimientos y asegurando las condiciones de calidad y seguridad.
- letra: l
  texto:
    es: Adaptarse a las nuevas situaciones laborales, manteniendo actualizados los conocimientos científicos, técnicos y tecnológicos relativos a su entorno profesional, gestionando su formación y los recursos existentes en el aprendizaje a lo largo de la vida y utilizando las tecnologías de la información y la comunicación.
- letra: m
  texto:
    es: Resolver situaciones, problemas o contingencias con iniciativa y autonomía en el ámbito de su competencia, con creatividad, innovación y espíritu de mejora en el trabajo personal y en el de los miembros del equipo.
- letra: 'n'
  texto:
    es: Organizar y coordinar equipos de trabajo, supervisando el desarrollo del mismo, con responsabilidad, manteniendo relaciones fluidas y asumiendo el liderazgo, así como aportando soluciones a los conflictos grupales que se presentan.
- letra: ñ
  texto:
    es: Comunicarse con sus iguales, superiores, clientes y personas bajo su responsabilidad, utilizando vías eficaces de comunicación, transmitiendo la información o conocimientos adecuados, y respetando la autonomía y competencia de las personas que intervienen en el ámbito de su trabajo.
- letra: o
  texto:
    es: Generar entornos seguros en el desarrollo de su trabajo y el de su equipo, supervisando y aplicando los procedimientos de prevención de riesgos laborales y ambientales de acuerdo con lo establecido por la normativa y los objetivos de la empresa.
- letra: p
  texto:
    es: Supervisar y aplicar procedimientos de gestión de calidad, de accesibilidad universal y de diseño para todos, en las actividades profesionales incluidas en los procesos de producción o prestación de servicios.
- letra: q
  texto:
    es: Realizar la gestión básica para la creación y funcionamiento de una pequeña empresa y tener iniciativa en su actividad profesional con sentido de la responsabilidad social.
- letra: r
  texto:
    es: Ejercer sus derechos y cumplir con las obligaciones derivadas de su actividad profesional, de acuerdo con lo establecido en la legislación vigente, participando activamente en la vida económica, social y cultural.

competencia_general:
  es: La competencia general de este título consiste en organizar y ejecutar las operaciones de gestión y administración en los procesos comerciales, laborales, contables, fiscales y financieros de una empresa pública o privada, aplicando la normativa vigente y los protocolos de gestión de calidad, gestionando la información, asegurando la satisfacción del cliente y/o usuario y actuando según las normas de prevención de riesgos laborales y protección medioambiental.
competencias:
- letra: a
  texto:
    es: Tramitar documentos o comunicaciones internas o externas en los circuitos de información de la empresa.
- letra: b
  texto:
    es: Elaborar documentos y comunicaciones a partir de órdenes recibidas, información obtenida y/o necesidades detectadas.
- letra: c
  texto:
    es: Detectar necesidades administrativas o de gestión de la empresa de diversos tipos, a partir del análisis de la información disponible y del entorno.
- letra: d
  texto:
    es: Proponer líneas de actuación encaminadas a mejorar la eficiencia de los procesos administrativos en los que interviene.
- letra: e
  texto:
    es: Clasificar, registrar y archivar comunicaciones y documentos según las técnicas apropiadas y los parámetros establecidos en la empresa.
- letra: f
  texto:
    es: Gestionar los procesos de tramitación administrativa empresarial en relación a las áreas comercial, financiera, contable y fiscal, con una visión integradora de las mismas.
- letra: g
  texto:
    es: Realizar la gestión contable y fiscal de la empresa, según los procesos y procedimientos administrativos, aplicando la normativa vigente y en condiciones de seguridad y calidad.
- letra: h
  texto:
    es: Supervisar la gestión de tesorería, la captación de recursos financieros y el estudio de viabilidad de proyectos de inversión, siguiendo las normas y protocolos establecidos.
- letra: i
  texto:
    es: Aplicar los procesos administrativos establecidos en la selección, contratación, formación y desarrollo de los Recursos Humanos, ajustándose a la normativa vigente y a la política empresarial.
- letra: j
  texto:
    es: Organizar y supervisar la gestión administrativa de personal de la empresa, ajustándose a la normativa laboral vigente y a los protocolos establecidos.
- letra: k
  texto:
    es: Realizar la gestión administrativa de los procesos comerciales, llevando a cabo las tareas de documentación y las actividades de negociación con proveedores, y de asesoramiento y relación con el cliente.
- letra: l
  texto:
    es: Atender a los clientes/usuarios en el ámbito administrativo y comercial asegurando los niveles de calidad establecidos y ajustándose a criterios éticos y de imagen de la empresa/institución.
- letra: m
  texto:
    es: Tramitar y realizar la gestión administrativa en la presentación de documentos en diferentes organismos y administraciones públicas, en plazo y forma requeridos.
- letra: 'n'
  texto:
    es: Adaptarse a las nuevas situaciones laborales, manteniendo actualizados los conocimientos científicos, técnicos y tecnológicos relativos a su entorno profesional, gestionando su formación y los recursos existentes en el aprendizaje a lo largo de la vida y utilizando las tecnologías de la información y la comunicación.
- letra: ñ
  texto:
    es: Resolver situaciones, problemas o contingencias con iniciativa y autonomía en el ámbito de su competencia, con creatividad, innovación y espíritu de mejora en el trabajo personal y en el de los miembros del equipo.
- letra: o
  texto:
    es: Organizar y coordinar equipos de trabajo con responsabilidad, supervisando el desarrollo del mismo, manteniendo relaciones fluidas y asumiendo el liderazgo, así como aportando soluciones a los conflictos grupales que se presenten.
- letra: p
  texto:
    es: Comunicarse con sus iguales, superiores, clientes y personas bajo su responsabilidad, utilizando vías eficaces de comunicación, transmitiendo la información o conocimientos adecuados y respetando la autonomía y competencia de las personas que intervienen en el ámbito de su trabajo.
- letra: q
  texto:
    es: Generar entornos seguros en el desarrollo de su trabajo y el de su equipo, supervisando y aplicando los procedimientos de prevención de riesgos laborales y ambientales, de acuerdo con lo establecido por la normativa y los objetivos de la empresa.
- letra: r
  texto:
    es: Supervisar y aplicar procedimientos de gestión de calidad, de accesibilidad universal y de “diseño para todos”, en las actividades profesionales incluidas en los procesos de producción o prestación de servicios.
- letra: s
  texto:
    es: Realizar la gestión básica para la creación y funcionamiento de una pequeña empresa y tener iniciativa en su actividad profesional con sentido de la responsabilidad social.
- letra: t
  texto:
    es: Ejercer sus derechos y cumplir con las obligaciones derivadas de su actividad profesional, de acuerdo con lo establecido en la legislación vigente, participando activamente en la vida económica, social y cultural.

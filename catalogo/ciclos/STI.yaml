competencia_general:
  es: La competencia general de este título consiste en desarrollar proyectos, así como gestionar y supervisar el montaje y mantenimiento de las infraestructuras comunes de telecomunicaciones y de sistemas y equipos de telecomunicaciones tales como redes de banda ancha y de radiocomunicaciones fijas y móviles, sistemas telemáticos, de producción audiovisual y de transmisión, a partir de la documentación técnica, normativa y procedimientos establecidos, asegurando el funcionamiento, la calidad, la seguridad y la conservación medioambiental.
competencias:
- letra: a
  texto:
    es: Desarrollar proyectos de instalaciones o sistemas de telecomunicaciones, obteniendo datos y características, para la elaboración de informes y especificaciones.
- letra: b
  texto:
    es: Calcular los parámetros de equipos, elementos e instalaciones, cumpliendo la normativa vigente y los requerimientos del cliente.
- letra: c
  texto:
    es: Elaborar el presupuesto de la instalación, cotejando los aspectos técnicos y económicos para ofrecer la mejor solución al cliente.
- letra: d
  texto:
    es: Configurar instalaciones y sistemas de telecomunicación, con las especificaciones y las prescripciones reglamentarias.
- letra: e
  texto:
    es: Gestionar el suministro y almacenamiento de los materiales y equipos, definiendo la logística asociada y controlando existencias.
- letra: f
  texto:
    es: Planificar el montaje de instalaciones y sistemas de telecomunicaciones según la documentación técnica y las condiciones de obra.
- letra: g
  texto:
    es: Realizar el lanzamiento del montaje de las instalaciones, partiendo del programa de montaje y del plan general de obra.
- letra: h
  texto:
    es: Supervisar y/o ejecutar los procesos de montaje de las instalaciones y sistemas, verificando su adecuación a las condiciones de obra y controlando su avance para cumplir con los objetivos de la empresa.
- letra: i
  texto:
    es: Planificar el mantenimiento a partir de la normativa, condiciones de la instalación y recomendaciones de los fabricantes.
- letra: j
  texto:
    es: Supervisar y/o ejecutar los procesos de mantenimiento de las instalaciones, controlando los tiempos y la calidad de los resultados.
- letra: k
  texto:
    es: Realizar la puesta en servicio de las instalaciones y equipos de telecomunicaciones, supervisando el cumplimiento de los requerimientos y asegurando las condiciones de calidad y seguridad.
- letra: l
  texto:
    es: Elaborar el estudio básico de seguridad y salud para la ejecución de las instalaciones, determinando las medidas de protección, seguridad y prevención de riesgos.
- letra: m
  texto:
    es: Adaptarse a las nuevas situaciones laborales, manteniendo actualizados los conocimientos científicos, técnicos y tecnológicos relativos a su entorno profesional, gestionando su formación y los recursos existentes en el aprendizaje a lo largo de la vida y utilizando las tecnologías de la información y la comunicación.
- letra: 'n'
  texto:
    es: Resolver situaciones, problemas o contingencias con iniciativa y autonomía en el ámbito de su competencia, con creatividad, innovación y espíritu de mejora en el trabajo personal y en el de los miembros del equipo.
- letra: ñ
  texto:
    es: Organizar y coordinar equipos de trabajo con responsabilidad, supervisando el desarrollo del mismo, manteniendo relaciones fluidas y asumiendo el liderazgo, así como aportando soluciones a los conflictos grupales que se presentan.
- letra: o
  texto:
    es: Comunicarse con sus iguales, superiores, clientes y personas bajo su responsabilidad, utilizando vías eficaces de comunicación, transmitiendo la información o conocimientos adecuados y respetando la autonomía y competencia de las personas que intervienen en el ámbito de su trabajo.
- letra: p
  texto:
    es: Generar entornos seguros en el desarrollo de su trabajo y el de su equipo, supervisando y aplicando los procedimientos de prevención de riesgos laborales y ambientales, de acuerdo con lo establecido por la normativa y los objetivos de la empresa.
- letra: q
  texto:
    es: Supervisar y aplicar procedimientos de gestión de calidad, de accesibilidad universal y de «diseño para todos» en las actividades profesionales incluidas en los procesos de producción o prestación de servicios.
- letra: r
  texto:
    es: Realizar la gestión básica para la creación y funcionamiento de una pequeña empresa y tener iniciativa en su actividad profesional con sentido de la responsabilidad social.
- letra: s
  texto:
    es: Ejercer sus derechos y cumplir con las obligaciones derivadas de su actividad profesional, de acuerdo con lo establecido en la legislación vigente, participando activamente en la vida económica, social y cultural.

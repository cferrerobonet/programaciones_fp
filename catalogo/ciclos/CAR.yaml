competencia_general:
  es: La competencia general de este título consiste en realizar las operaciones de reparación, montaje de accesorios y transformaciones del vehículo en el área de carrocería, bastidor, cabina y equipos o aperos, ajustándose a procedimientos y tiempos establecidos, cumpliendo con las especificaciones de calidad, seguridad y protección ambiental.
competencias:
- letra: a
  texto:
    es: Determinar los procesos de reparación interpretando la información técnica incluida en manuales y catálogos, según el buen hacer profesional.
- letra: b
  texto:
    es: Localizar y diagnosticar deformaciones en las estructuras de los vehículos, siguiendo procedimientos establecidos y el buen hacer profesional.
- letra: c
  texto:
    es: Sustituir y ajustar elementos que forman parte de la carrocería del vehículo, montados mediante uniones desmontables.
- letra: d
  texto:
    es: Reparar elementos metálicos y sintéticos de la carrocería utilizando las técnicas y procedimientos establecidos.
- letra: e
  texto:
    es: Sustituir y ajustar elementos o partes de ellos de la carrocería mediante uniones fijas aplicando las técnicas apropiadas.
- letra: f
  texto:
    es: Preparar, proteger y embellecer superficies del vehículo aplicando procedimientos definidos.
- letra: g
  texto:
    es: Reparar deformaciones de elementos fijos estructurales de la carrocería manejando los equipos requeridos y aplicando las técnicas adecuadas.
- letra: h
  texto:
    es: Verificar los resultados de sus intervenciones comparándolos con los estándares de calidad establecidos por el fabricante.
- letra: i
  texto:
    es: Realizar el mantenimiento de primer nivel en máquinas y equipos, de acuerdo con la ficha de mantenimiento y la periodicidad establecida.
- letra: j
  texto:
    es: Aplicar procedimientos de prevención de riesgos laborales y ambientales, de acuerdo con lo establecido por normativa.
- letra: k
  texto:
    es: Cumplir con los objetivos de la empresa, colaborando con el equipo de trabajo y actuando con los principios de responsabilidad y tolerancia.
- letra: l
  texto:
    es: Resolver problemas y tomar decisiones individuales siguiendo las normas y procedimientos establecidos, definidos dentro del ámbito de su competencia.
- letra: m
  texto:
    es: Adaptarse a diferentes puestos de trabajo y a las nuevas situaciones laborales originadas por cambios tecnológicos y organizativos en los procesos productivos.
- letra: 'n'
  texto:
    es: Ejercer sus derechos y cumplir con las obligaciones derivadas de las relaciones laborales, de acuerdo con lo establecido en la legislación vigente.
- letra: ñ
  texto:
    es: Gestionar su carrera profesional, analizando las oportunidades de empleo, autoempleo y de aprendizaje.
- letra: o
  texto:
    es: Crear y gestionar una pequeña empresa, realizando un estudio de viabilidad de productos, de planificación de la producción y de comercialización.
- letra: p
  texto:
    es: Participar de forma activa en la vida económica, social y cultural, con una actitud crítica y de responsabilidad.

# Curso escolar 2026-2027: fechas de evaluación y periodos de formación en empresa (docs/MODELO_DE_DATOS.md §1).
# Lo da de alta CarlosFB (no lo genera scripts/catalogo.py). Fuentes, en la bóveda, carpeta 02 CURSOS ESCOLARES/2026-2027:
#   · «Calendario escolar FP 2026-2027» (PDF del centro): evaluaciones, comunes a GB, GM y GS.
#   · «Calendario FE (prácticas en empresa) 2026-2027» (propuesta del centro, fechas confirmadas por CarlosFB el
#     2026-10-04; FE de Pascua mantenida por su decisión del 2026-10-17).
#   · «No lectivos 2026-2027», alineada con la resolución del calendario escolar (DOGV 10387).
# Lectura de la propuesta de FE: «- 7h» = jornada de 7 h; sin sufijo, 8 h. Quien hace 7 h/día hace el bloque de 8 h y,
# además, los días «- 7h» de su curso (como en las programaciones de 1.º revisadas el 2026-10-06). En 2.º, 50 días
# a 7 h, como sale de la propuesta (confirmado por CarlosFB el 2026-10-17).
# Convocatorias (CarlosFB, 2026-10-18, tras revisar el documento exportado): ordinaria el 2027-06-08 y extraordinaria
# el 2027-06-22, para GB, GM y GS. En el calendario escolar del centro son las entregas de boletines; las convocatorias
# del calendario (2027-05-31 → 06-03 y 2027-06-14 → 06-17) no se usan, por decisión suya.
formato: curso/1
curso_escolar: 2026-2027
fuente:
  documentos:
    - Calendario escolar FP 2026-2027 (centro)
    - Calendario FE (prácticas en empresa) 2026-2027 (propuesta del centro, confirmada por CarlosFB)
    - No lectivos 2026-2027 (resolución del calendario escolar, DOGV 10387)
  confirmado: 2026-10-18

evaluaciones:
  inicial: 2026-09-30      # «fin de la evaluación inicial»; las evaluaciones son comunes a GB, GM y GS (CarlosFB)
  primera: 2026-11-20
  segunda: 2027-02-26
  tercera: 2027-05-28      # CarlosFB (2026-10-11, confirmado el 2026-10-17): no el 27/05 del calendario (ADR-023)
ordinaria:                 # un solo día: «se realizará el 8 de junio de 2027»
  desde: 2027-06-08
  hasta: 2027-06-08
extraordinaria_desde: 2027-06-22

# Itinerario «1.º + 2.º»: GM (IEA, IT, CAR, EMV) y GS (ARI, STI, SEA, AUT, ADM, ISO). Por grado y curso.
formacion_empresa:
  GM:
    1:
      - {jornada: 8, dias: 20, desde: 2027-05-03, hasta: 2027-05-28}
      - {jornada: 7, dias: 23, desde: 2027-04-28, hasta: 2027-05-28}
    2:
      - {jornada: 8, dias: 43, desde: 2027-03-08, hasta: 2027-05-21}
      - {jornada: 7, dias: 50, desde: 2027-03-03, hasta: 2027-05-21}
  GS:
    1:
      - {jornada: 8, dias: 20, desde: 2027-05-03, hasta: 2027-05-28}
      - {jornada: 7, dias: 23, desde: 2027-04-28, hasta: 2027-05-28}
    2:
      - {jornada: 8, dias: 43, desde: 2027-03-08, hasta: 2027-05-21}
      - {jornada: 7, dias: 50, desde: 2027-03-03, hasta: 2027-05-21}

# Excepciones por ciclo a la de su grado: 1.º de GA va en febrero (itinerario «1.º GA»).
formacion_empresa_ciclo:
  GA:
    1:
      - {jornada: 8, dias: 20, desde: 2027-02-01, hasta: 2027-02-26}
      - {jornada: 7, dias: 23, desde: 2027-01-27, hasta: 2027-02-26}

# Lo que las fuentes no dan: el documento lo enseña como «pendiente» y la exportación definitiva espera (V-11).
pendiente:
  - ciclo: GA
    curso: 2
    motivo: formación en empresa de 2.º de GA (la propuesta del centro solo da la de 1.º de GA)
  - ciclo: EE
    curso: 1
    motivo: formación en empresa de Grado Básico (no está en el calendario de FE del centro ni en calendarios.epla.es, consultados el 2026-10-17)
  - ciclo: EE
    curso: 2
    motivo: formación en empresa de Grado Básico (no está en el calendario de FE del centro ni en calendarios.epla.es, consultados el 2026-10-17)
  - ciclo: IC
    curso: 1
    motivo: formación en empresa de Grado Básico (no está en el calendario de FE del centro ni en calendarios.epla.es, consultados el 2026-10-17)
  - ciclo: IC
    curso: 2
    motivo: formación en empresa de Grado Básico (no está en el calendario de FE del centro ni en calendarios.epla.es, consultados el 2026-10-17)
  - ciclo: MV
    curso: 1
    motivo: formación en empresa de Grado Básico (no está en el calendario de FE del centro ni en calendarios.epla.es, consultados el 2026-10-17)
  - ciclo: MV
    curso: 2
    motivo: formación en empresa de Grado Básico (no está en el calendario de FE del centro ni en calendarios.epla.es, consultados el 2026-10-17)
  - ciclo: SA
    curso: 1
    motivo: formación en empresa de Grado Básico (no está en el calendario de FE del centro ni en calendarios.epla.es, consultados el 2026-10-17)
  - ciclo: SA
    curso: 2
    motivo: formación en empresa de Grado Básico (no está en el calendario de FE del centro ni en calendarios.epla.es, consultados el 2026-10-17)

# Días de Proyecto intermodular de la propuesta («PROY»). No salen en el documento: el apartado 9.1 lleva el párrafo
# fijo del Proyecto de la plantilla.
proyecto:
  1:
    - {desde: 2027-01-27, hasta: 2027-01-29}
    - {desde: 2027-04-28, hasta: 2027-04-30}
  2:
    - {desde: 2027-03-01, hasta: 2027-03-02}
    - {desde: 2027-05-25, hasta: 2027-05-27}
